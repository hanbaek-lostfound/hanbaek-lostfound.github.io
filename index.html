<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한백 분실물</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="한백고 분실물을 사진 한 장으로 찾아요">

<!-- 화면이 그려지기 전에 테마를 정해서 흰 번쩍임 방지 + 새로 열 때만 시작 화면 -->
<script>
(function(){
  var t; try{ t = localStorage.getItem("lf-theme"); }catch(e){}
  var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  var d = document.documentElement;
  if(t === "dark" || t === "light") d.dataset.theme = t;
  d.style.background = dark ? "#101214" : "#ffffff";
  try{
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduce && !sessionStorage.getItem("lf-seen")){ sessionStorage.setItem("lf-seen","1"); d.classList.add("booting"); }
  }catch(e){}
})();
</script>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="themeMeta" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한백 분실물">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* 레이아웃: 한 손 조작 기준 단일 열 앱. 상단 제목·세그먼트, 2열 사진 그리드, 하단 탭바 + 떠 있는 등록 버튼. 태블릿·PC는 가운데 600px */
:root{
  --bg:#ffffff; --bg-2:#f4f5f7; --fill:#f1f3f5; --fill-2:#e9ecef; --line:#e6e8eb;
  --ink:#121417; --ink-2:#4b525c; --ink-3:#7b838d;
  --accent:#00875f; --accent-ink:#ffffff; --accent-soft:#e3f4ec; --accent-text:#00704f;
  --lost:#b85800; --lost-soft:#fff0e1;
  --danger:#d63b3b; --scrim:rgba(12,14,16,.42);
  --sheet:#ffffff; --nav:rgba(255,255,255,.92);
  --shadow:0 8px 24px rgba(17,20,24,.10),0 2px 6px rgba(17,20,24,.06);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --tab-h:58px; --maxw:600px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --bg-2:#000000; --fill:#1c1f23; --fill-2:#2a2e34; --line:#262a2f;
  --ink:#f2f4f6; --ink-2:#b4bbc4; --ink-3:#8a929c;
  --accent:#2fc48d; --accent-ink:#04150e; --accent-soft:#12302a; --accent-text:#4fd6a2;
  --lost:#ffa04d; --lost-soft:#33230f; --danger:#ff6b6b; --scrim:rgba(0,0,0,.6);
  --sheet:#1a1d21; --nav:rgba(16,18,20,.9); --shadow:0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --bg-2:#000000; --fill:#1c1f23; --fill-2:#2a2e34; --line:#262a2f;
  --ink:#f2f4f6; --ink-2:#b4bbc4; --ink-3:#8a929c;
  --accent:#2fc48d; --accent-ink:#04150e; --accent-soft:#12302a; --accent-text:#4fd6a2;
  --lost:#ffa04d; --lost-soft:#33230f; --danger:#ff6b6b; --scrim:rgba(0,0,0,.6);
  --sheet:#1a1d21; --nav:rgba(16,18,20,.9); --shadow:0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
::selection{background:var(--accent-soft);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input,textarea{caret-color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
svg{flex:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform 160ms var(--ease),background-color 160ms ease,opacity 160ms ease}
.press:active{transform:scale(.97)}

/* ---------- 시작 화면 ---------- */
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;place-items:center}
html.booting #boot{display:grid}
html.booting #app,html.booting #tabbar,html.booting #fab{visibility:hidden}
#boot.off{opacity:0;transition:opacity 240ms var(--ease)}
.boot-mark{width:88px;height:88px;border-radius:24px;background:#00875f;display:grid;place-items:center;
  animation:bootIn 420ms var(--ease) both;box-shadow:0 10px 30px rgba(0,135,95,.28)}
.boot-mark svg{width:58px;height:58px;transform:rotate(-14deg)}
.boot-mark .chk{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 360ms 220ms var(--ease) forwards}
.boot-name{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
  font-weight:700;font-size:15px;color:var(--ink-3);animation:fadeUp 360ms 260ms var(--ease) both}
#boot.off .boot-mark{transform:scale(.94);filter:blur(4px);transition:transform 240ms var(--ease),filter 240ms ease}
@keyframes bootIn{from{transform:translateY(10px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeUp{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 앱 틀 ---------- */
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 12px;
  margin-inline:calc(-1*max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px))}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
h1.big{font-size:26px;line-height:1.25;font-weight:750;letter-spacing:-.03em;margin:0}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:24px;height:24px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;position:relative;margin-top:8px}
.seg button{position:relative;z-index:1;height:40px;border-radius:9px;font-size:15px;font-weight:650;color:var(--ink-3);transition:color 200ms ease}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--bg);
  box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.04);transition:transform 260ms var(--ease)}
:root[data-theme="dark"] .seg .thumb{background:var(--fill-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg .thumb{background:var(--fill-2)}}

.search{position:relative;display:block;margin-top:10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:46px;border:0;border-radius:12px;background:var(--fill);padding:0 40px 0 44px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--ink-3)}
.search .clear svg{position:static;transform:none;width:20px;height:20px;pointer-events:auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px;
  margin-inline:calc(-1*max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;min-height:36px}
.bar h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em}
.bar .sub{font-size:15px;color:var(--ink-3);font-weight:600;margin-left:2px;font-variant-numeric:tabular-nums}
.link-btn{font-size:14px;color:var(--ink-3);font-weight:600;height:36px;display:inline-flex;align-items:center;gap:2px}
.link-btn svg{width:16px;height:16px}
.toggle-done{font-size:14px;color:var(--ink-3);font-weight:600;display:inline-flex;align-items:center;gap:6px;height:36px}
.toggle-done .box{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;place-items:center}
.toggle-done[aria-pressed="true"] .box{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.toggle-done .box svg{width:14px;height:14px;opacity:0}
.toggle-done[aria-pressed="true"] .box svg{opacity:1}

/* ---------- 그리드 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:grid;gap:8px;text-align:left;min-width:0;align-content:start}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--fill);max-width:100%;isolation:isolate}
.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 220ms ease}
.ph img.on{opacity:1}
.ph .cat-ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3)}
.ph .cat-ic svg{width:38%;height:38%;stroke-width:1.4}
.ph .state{position:absolute;z-index:2;left:8px;top:8px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;
  background:rgba(18,20,23,.72);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.item.done .ph::after{content:"";position:absolute;z-index:1;inset:0;background:var(--bg);opacity:.45}
.item-title{font-size:15px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;overflow-wrap:anywhere}
.item-meta{font-size:13px;color:var(--ink-3);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.item-meta .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;vertical-align:middle;margin:0 5px;opacity:.7}
.skel{background:var(--fill);border-radius:14px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--bg) 55%,transparent),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.more{display:flex;justify-content:center;margin-top:24px}

.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:56px 12px 24px;color:var(--ink-3);font-size:15px;line-height:1.55}
.empty .em-ic{width:64px;height:64px;border-radius:20px;background:var(--fill);display:grid;place-items:center;color:var(--ink-3);margin-bottom:4px}
.empty .em-ic svg{width:30px;height:30px}
.empty b{color:var(--ink);font-size:17px;font-weight:700;letter-spacing:-.02em}
.empty .btn{margin-top:10px}

/* ---------- 버튼 ---------- */
.btn{height:52px;padding:0 20px;border-radius:14px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.danger{color:var(--danger)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px}

/* ---------- 탭바 ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{max-width:var(--maxw);margin:0 auto;display:flex;height:var(--tab-h)}
.tabs button{flex:1;display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
#fab{position:fixed;z-index:31;right:max(calc(20px + env(safe-area-inset-right,0px)),calc((100vw - var(--maxw))/2 + 20px));
  bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border-radius:26px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(0,135,95,.32),0 2px 6px rgba(0,0,0,.12)}
#fab svg{width:22px;height:22px}

/* ---------- 전체 화면 패널 ---------- */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  transform:translateX(0);transition:transform 320ms var(--ease-drawer),opacity 200ms ease}
.layer.enter{transform:translateX(100%)}
.layer.leave{transform:translateX(100%);pointer-events:none}
.layer.up.enter,.layer.up.leave{transform:translateY(100%)}
@media (prefers-reduced-motion: reduce){.layer{transition:opacity 160ms ease}.layer.enter,.layer.leave,.layer.up.enter,.layer.up.leave{transform:none;opacity:0}}
.layer-in{max-width:var(--maxw);margin:0 auto;min-height:100%;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:0 calc(120px + env(safe-area-inset-bottom,0px));position:relative}
.layer-in.chat-in{padding-bottom:0;display:flex;flex-direction:column}
.nav-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;min-height:52px;padding-top:env(safe-area-inset-top,0px);background:var(--bg);
  margin-inline:-12px}
.nav-bar h2{flex:1;min-width:0;font-size:17px;font-weight:700;margin:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-bar .icon-btn{flex:none}
.nav-bar.clear{position:absolute;left:0;right:0;top:0;background:transparent;margin:0;padding-inline:8px}
.nav-bar.clear .icon-btn{background:rgba(18,20,23,.42);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:22px;width:40px;height:40px;margin:2px}
.bottom-cta{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);box-shadow:0 -1px 0 var(--line);
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.bottom-cta .in{max-width:calc(var(--maxw) - 40px);margin:0 auto;display:flex;gap:10px}
.bottom-cta .btn{flex:1}

/* 상세 */
.hero{margin-inline:calc(-1*max(20px,env(safe-area-inset-left,0px)));aspect-ratio:1;max-height:62vh;background:var(--fill);position:relative;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cat-ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3)}
.hero .cat-ic svg{width:30%;height:30%;stroke-width:1.2}
.hero.no-photo{aspect-ratio:16/9}
.d-head{padding-top:20px;display:grid;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{height:26px;padding:0 9px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.pill.found{background:var(--accent-soft);color:var(--accent-text)}
.pill.lost{background:var(--lost-soft);color:var(--lost)}
.pill.done{background:var(--fill);color:var(--ink-3)}
.pill.warn{background:var(--lost-soft);color:var(--lost)}
.pill.num{background:var(--fill);color:var(--ink-2);font-variant-numeric:tabular-nums}
.d-title{font-size:23px;line-height:1.35;font-weight:750;letter-spacing:-.03em;margin:2px 0 0;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.d-time{font-size:14px;color:var(--ink-3)}
.facts{margin:20px 0 0}
.facts div{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.facts div:last-child{border-bottom:1px solid var(--line)}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:500}
.desc{margin:20px 0 0;font-size:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.section-h{font-size:17px;font-weight:700;margin:36px 0 12px;display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.section-h .count{color:var(--ink-3);font-weight:600}
.section-h svg{width:18px;height:18px;color:var(--accent)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:132px;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;
  margin-inline:calc(-1*max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));scroll-padding-inline:20px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .item{scroll-snap-align:start}
.match-score{font-size:12px;font-weight:700;color:var(--accent-text);margin-top:-4px}
.note{font-size:14px;color:var(--ink-3);line-height:1.55;margin:0}
.note.box{background:var(--fill);border-radius:12px;padding:12px 14px;color:var(--ink-2)}
.comments{display:grid;gap:18px}
.cmt{display:grid;grid-template-columns:32px 1fr;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center;color:var(--ink-3)}
.avatar svg{width:18px;height:18px}
.avatar.owner{background:var(--accent-soft);color:var(--accent-text)}
.cmt-h{display:flex;gap:6px;align-items:baseline;font-size:14px}
.cmt-h b{font-weight:700}
.cmt-h span{color:var(--ink-3);font-size:13px}
.cmt p{margin:2px 0 0;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:20px}
.composer textarea{flex:1;min-width:0;border:0;background:var(--fill);border-radius:20px;padding:9px 16px;font-size:16px;line-height:1.4;resize:none;max-height:120px;height:40px}
.composer textarea::placeholder{color:var(--ink-3)}
.send{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{background:var(--fill-2);color:var(--ink-3)}
.send svg{width:20px;height:20px}
.reveal{margin-top:16px;background:var(--lost-soft);color:var(--lost);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

/* 등록 폼 */

.ai-line{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--accent-text);font-weight:600;min-height:24px}

let toastTimer;
function toast(msg, ms=2400){
  const box=$("#toasts"); box.innerHTML=""; clearTimeout(toastTimer);
  const t=document.createElement("div"); t.className="toast enter"; t.textContent=msg; box.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.remove("enter")));
  toastTimer=setTimeout(()=>{ t.classList.add("leave"); setTimeout(()=>t.remove(),280); }, ms);
}

/* 사진 압축: 긴 변 1080px, JPEG 0.74 → 보통 100~220KB. 사진 회전(EXIF)도 바로잡음 */
async function compressImage(file, max=1080, q=0.74){
  let src;
  try{ src = await createImageBitmap(file, { imageOrientation:"from-image" }); }
  catch{ const url=URL.createObjectURL(file); src = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;}); }
  const w=src.width, h=src.height; if(!w||!h) throw new Error("bad image");
  const s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,c.width,c.height);
  const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  if(!blob) throw new Error("bad image");
  return { blob, url: URL.createObjectURL(blob), dataUrl: DEMO ? c.toDataURL("image/jpeg",0.6) : "" };
}

/* ---------- AI 보조: 키워드 추정 + 비슷한 글 점수 ---------- */
function guessTags(text){
  const t = text||""; let cat=null, color=null;
  for(const [c,words] of Object.entries(KEYWORDS)) if(words.some(w=>t.includes(w))){cat=c;break;}
  for(const [c] of COLORS) if(c!=="기타" && t.includes(c)){color=c;break;}
  if(!color){ if(/검은|블랙/.test(t)) color="검정"; else if(/하얀|화이트/.test(t)) color="흰색"; else if(/네이비/.test(t)) color="남색"; else if(/핑크/.test(t)) color="분홍"; }
  const keywords = Object.values(KEYWORDS).flat().filter(w=>t.includes(w)).slice(0,5);
  return {cat,color,keywords};
}
function grams(s){ const out=new Set(); (s||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean).forEach(w=>{ out.add(w); for(let i=0;i<w.length-1;i++) out.add(w.slice(i,i+2)); }); return out; }
function cosine(a,b){ let d=0,x=0,y=0; for(let i=0;i<Math.min(a.length,b.length);i++){d+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i];} return d/(Math.sqrt(x*y)||1); }
function matchScore(a,b){
  if(a.embedding && b.embedding) return Math.max(0,Math.min(1,(cosine(a.embedding,b.embedding)-0.45)/0.4)) * (a.cat===b.cat?1:0.7);
  const A=grams(a.title+" "+(a.desc||"")+" "+(a.ai?.keywords||[]).join(" ")), B=grams(b.title+" "+(b.desc||"")+" "+(b.ai?.keywords||[]).join(" "));
  let inter=0; A.forEach(g=>{if(B.has(g))inter++;});
  let s = inter/Math.max(1,Math.min(A.size,B.size));
  if(a.cat===b.cat) s+=0.25; else s-=0.2;
  if(a.color && a.color===b.color) s+=0.2;
  if(a.place && a.place===b.place) s+=0.1;
  return Math.max(0,Math.min(1,s));
}

class FireStore{
  constructor(){ this.mode="live"; this.ownerIds=null; this.embCache=new Map(); }
  async init(){
    const V="10.12.2", B=`https://www.gstatic.com/firebasejs/${V}/`;
    const [app,auth,fs] = await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    this.f=fs; this.a=auth;
    this.app=app.initializeApp(CONFIG.firebase); this.auth=auth.getAuth(this.app);
    // 기기 안에 사본을 저장 → 다시 열 때 빠르고 서버 읽기 횟수도 줄어요 (여러 탭 지원, 실패하면 메모리 사용)
    try{ this.db=fs.initializeFirestore(this.app,{ localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch{ this.db=fs.getFirestore(this.app); }
    try{ await auth.getRedirectResult(this.auth); }catch(e){ this.redirectError=e; }
    await new Promise(r=>{ const off=auth.onAuthStateChanged(this.auth,()=>{ off(); r(); }); });
  }
  get uid(){ return this.auth.currentUser?.uid; }
  async signIn(){
    const p=new this.a.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await this.a.signInWithPopup(this.auth,p); }
    catch(e){
      if(/popup-blocked|operation-not-supported|web-storage-unsupported/.test(e.code||"")) return this.a.signInWithRedirect(this.auth,p);
      throw e;
    }
  }
  async signOut(){ await this.a.signOut(this.auth); }
  d(...p){ return this.f.doc(this.db,...p); } c(...p){ return this.f.collection(this.db,...p); }
  async me(){
    if(!this.uid) return null;
    const {getDoc}=this.f;
    const [pub,priv,adm]=await Promise.all([getDoc(this.d("users",this.uid)),getDoc(this.d("private",this.uid)),getDoc(this.d("admins",this.uid)).catch(()=>null)]);
    if(!priv.exists()) return {uid:this.uid,needsProfile:true};

    b.set(this.d("users",this.uid),{nickname:randNick(),points:0});
    await b.commit();
  }
  async loadOwnerIds(){
    if(this.ownerIds) return this.ownerIds;
    const {query,where,getDocs}=this.f;
    const s=await getDocs(query(this.c("postOwners"),where("ownerUid","==",this.uid)));
    this.ownerIds=new Set(s.docs.map(d=>d.id)); return this.ownerIds;
  }
  norm(s){ const x=s.data({serverTimestamps:"estimate"}); return {...x,id:s.id,createdAt:x.createdAt?.toMillis?.()??Date.now(),mine:this.ownerIds?.has(s.id)||false}; }
  // 실시간 목록: 처음 한 번 읽고 나면 바뀐 글만 받아요 (여러 명이 동시에 써도 읽기 횟수가 적음)
  watchFeed(cb, n=CONFIG.feedSize, admin=false){
    const {query,orderBy,limit,where,onSnapshot}=this.f;
    const q = admin ? query(this.c("posts"),orderBy("createdAt","desc"),limit(n)) : query(this.c("posts"),where("hidden","==",false),orderBy("createdAt","desc"),limit(n));
    return onSnapshot(q, s=>cb(s.docs.map(d=>this.norm(d)), s.metadata.fromCache, s.size>=n), e=>cb(null,false,false,e));
  }
  async getPost(id){ const s=await this.f.getDoc(this.d("posts",id)); return s.exists()?this.norm(s):null; }
  async uploadPhoto(blob){
    const token=await this.auth.currentUser.getIdToken();
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),30000);
    try{
      const r=await fetch(CONFIG.workerUrl+"/upload",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"image/jpeg"},body:blob,signal:ctrl.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||"사진을 올리지 못했어요");
      return j.url;
    }catch(e){ throw new Error(e.name==="AbortError"?"사진 올리기가 너무 오래 걸려요. 다시 시도해 주세요":(e.message==="Failed to fetch"?"인터넷 연결을 확인해 주세요":e.message)); }
    finally{ clearTimeout(t); }
  }
  async embed(text){
    if(!CONFIG.workerUrl) return null;
    try{ const token=await this.auth.currentUser.getIdToken();
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),12000);
      const r=await fetch(CONFIG.workerUrl+"/ai/embed",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({text}),signal:ctrl.signal});
      clearTimeout(t); return r.ok?(await r.json()).vector:null; }catch{return null;}
  }
  async createPost(d, photo){
    const id=this.f.doc(this.c("posts")).id;
    const url = photo && CONFIG.workerUrl ? await this.uploadPhoto(photo.blob) : "";
    const vec = await this.embed(`${d.title}. ${d.cat}. ${d.color||""}. ${d.place}. ${d.desc||""}`);
    const b=this.f.writeBatch(this.db);
    b.set(this.d("posts",id),{...d,photo:url,status:"open",hidden:false,commentCount:0,tag:tagNo(d.type),createdAt:this.f.serverTimestamp()});
    b.set(this.d("postOwners",id),{ownerUid:this.uid});
    if(vec) b.set(this.d("embeddings",id),{v:vec,type:d.type});
    (await this.loadOwnerIds()).add(id);
    await b.commit(); return id;
  }
  // AI 비교는 내 글을 볼 때만 (읽기 횟수 절약)
  async withEmbeddings(posts){
    const {getDoc}=this.f;
    await Promise.all(posts.map(async p=>{
      if(p.embedding) return;
      if(this.embCache.has(p.id)){ const v=this.embCache.get(p.id); if(v) p.embedding=v; return; }
      const s=await getDoc(this.d("embeddings",p.id)).catch(()=>null);
      const v=s?.exists()?s.data().v:null; this.embCache.set(p.id,v); if(v) p.embedding=v;
    }));
  }
  async setStatus(id,status){ await this.f.updateDoc(this.d("posts",id),{status}); }
  async deletePost(id){ const b=this.f.writeBatch(this.db); b.delete(this.d("posts",id)); b.delete(this.d("postOwners",id)); b.delete(this.d("embeddings",id)); await b.commit(); this.ownerIds?.delete(id); }
  async listComments(pid){ const {query,orderBy,getDocs,limit}=this.f; const s=await getDocs(query(this.c("posts",pid,"comments"),orderBy("at","asc"),limit(200)));
    return s.docs.map(x=>{ const d=x.data({serverTimestamps:"estimate"}); return {...d,id:x.id,at:d.at?.toMillis?.()??Date.now()}; }).filter(c=>!c.hidden); }
  async addComment(pid,text){
    const isOwner = (await this.loadOwnerIds()).has(pid);
    const cid=this.f.doc(this.c("posts",pid,"comments")).id; const b=this.f.writeBatch(this.db);
    b.set(this.d("posts",pid,"comments",cid),{text,isOwner,hidden:false,at:this.f.serverTimestamp()});
    b.set(this.d("commentAuthors",pid+"_"+cid),{uid:this.uid,postId:pid});
    b.update(this.d("posts",pid),{commentCount:this.f.increment(1)});
    await b.commit();
  }
  split(id){ const i=id.indexOf("__"); return [id.slice(0,i), id.slice(i+2)]; }
  async openChat(pid){
    const ref=this.d("posts",pid,"chats",this.uid); const s=await this.f.getDoc(ref).catch(()=>null);
    if(!s?.exists()){ if((await this.loadOwnerIds()).has(pid)) throw new Error("내 글에는 대화를 열 수 없어요");
      const p=await this.getPost(pid);
      await this.f.setDoc(ref,{postId:pid,starterUid:this.uid,postTitle:p.title.slice(0,40),last:"",updatedAt:this.f.serverTimestamp()}); }
    return pid+"__"+this.uid;
  }
  async listChats(){
    const {query,where,getDocs,collectionGroup,limit}=this.f;
    const started=(await getDocs(query(collectionGroup(this.db,"chats"),where("starterUid","==",this.uid),limit(50)))).docs.map(d=>({...d.data(),id:d.data().postId+"__"+d.id,role:"starter"}));
    const owned=[];
    await Promise.all([...(await this.loadOwnerIds())].map(async pid=>{ const s=await getDocs(this.c("posts",pid,"chats")).catch(()=>null); s?.docs.forEach(d=>owned.push({...d.data(),id:pid+"__"+d.id,role:"owner"})); }));
    return [...started,...owned].map(c=>({...c,updatedAt:c.updatedAt?.toMillis?.()??0})).sort((a,b)=>b.updatedAt-a.updatedAt);
  }
  async getChat(id){ const [pid,sid]=this.split(id); const s=await this.f.getDoc(this.d("posts",pid,"chats",sid)); if(!s.exists()) return null; const c=s.data();
    const role = sid===this.uid?"starter":((await this.loadOwnerIds()).has(pid)?"owner":"admin");
    return {id,postId:pid,postTitle:c.postTitle,role}; }
  watchMessages(id,cb){ const [pid,sid]=this.split(id); const {query,orderBy,onSnapshot,limit}=this.f;
    return onSnapshot(query(this.c("posts",pid,"chats",sid,"messages"),orderBy("at","asc"),limit(300)),s=>cb(s.docs.map(d=>{const x=d.data({serverTimestamps:"estimate"}); return {...x,id:d.id,at:x.at?.toMillis?.()??Date.now()};})),e=>showError(e)); }
  async sendMessage(id,text){ const c=await this.getChat(id); const [pid,sid]=this.split(id); const b=this.f.writeBatch(this.db);
    b.set(this.f.doc(this.c("posts",pid,"chats",sid,"messages")),{from:c.role,text,at:this.f.serverTimestamp()});
    b.update(this.d("posts",pid,"chats",sid),{last:text.slice(0,80),updatedAt:this.f.serverTimestamp()}); await b.commit(); }
  async requestReward(pid,chatId){ await this.f.setDoc(this.d("rewards",pid),{postId:pid,chatId,status:"pending",createdAt:this.f.serverTimestamp()}); await this.setStatus(pid,"done"); }
  async leaderboard(){ const {query,orderBy,limit,getDocs}=this.f; const s=await getDocs(query(this.c("users"),orderBy("points","desc"),limit(10))); return s.docs.map(d=>({...d.data(),you:d.id===this.uid})); }
  async myPosts(){ const ids=[...(await this.loadOwnerIds())]; const out=(await Promise.all(ids.map(id=>this.getPost(id).catch(()=>null)))).filter(Boolean); return out.sort((a,b)=>b.createdAt-a.createdAt); }
  async report(pid,reason){ await this.f.addDoc(this.c("reports"),{postId:pid,reason,status:"open",reporterUid:this.uid,createdAt:this.f.serverTimestamp()}); }
  async adminReveal(pid,why){
    const o=await this.f.getDoc(this.d("postOwners",pid)); const uid=o.data().ownerUid;
    await this.f.addDoc(this.c("auditLogs"),{postId:pid,why,by:this.uid,at:this.f.serverTimestamp()});
    const p=await this.f.getDoc(this.d("private",uid)); return p.data();
  }
  async titleOf(pid){ return (await this.getPost(pid).catch(()=>null))?.title||"(삭제된 글)"; }
  async adminReports(){ const {query,where,getDocs,limit}=this.f; const s=await getDocs(query(this.c("reports"),where("status","==","open"),limit(50)));
    return Promise.all(s.docs.map(async d=>({...d.data(),id:d.id,createdAt:d.data().createdAt?.toMillis?.()??0,postTitle:await this.titleOf(d.data().postId)}))); }
  async adminCloseReport(id){ await this.f.updateDoc(this.d("reports",id),{status:"closed"}); }
  async adminHide(pid,hidden){ await this.f.updateDoc(this.d("posts",pid),{hidden}); }
  async adminRewards(){ const {query,where,getDocs,limit}=this.f; const s=await getDocs(query(this.c("rewards"),where("status","==","pending"),limit(50)));
    return Promise.all(s.docs.map(async d=>({...d.data(),id:d.id,postTitle:await this.titleOf(d.data().postId)}))); }
  async adminDecideReward(id,ok){
    const r=(await this.f.getDoc(this.d("rewards",id))).data(); const b=this.f.writeBatch(this.db);
    b.update(this.d("rewards",id),{status:ok?"approved":"rejected"});
    if(ok){ const post=(await this.f.getDoc(this.d("posts",r.postId))).data();
      const finder = post.type==="lost" ? this.split(r.chatId)[1] : (await this.f.getDoc(this.d("postOwners",r.postId))).data()?.ownerUid;
      if(finder) b.update(this.d("users",finder),{points:this.f.increment(CONFIG.rewardPoints)}); }
    await b.commit();
  }
  async adminAudit(){ const {query,orderBy,limit,getDocs}=this.f; const s=await getDocs(query(this.c("auditLogs"),orderBy("at","desc"),limit(10)));
    return Promise.all(s.docs.map(async d=>({...d.data(),at:d.data().at?.toMillis?.()??0,postTitle:await this.titleOf(d.data().postId)}))); }
  async aiTag(photo,text){
    if(!CONFIG.workerUrl) return {...guessTags(text),source:"keyword"};
    try{ const token=await this.auth.currentUser.getIdToken(); const fd=new FormData(); if(photo) fd.append("image",photo.blob,"p.jpg"); fd.append("text",text||"");
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),25000);
      const r=await fetch(CONFIG.workerUrl+"/ai/tag",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd,signal:ctrl.signal}); clearTimeout(t);
      if(r.ok){ const j=await r.json(); const g=guessTags(text); return {cat:j.cat||g.cat,color:j.color||g.color,title:j.title,keywords:(j.keywords?.length?j.keywords:g.keywords),source:"ai"}; } }catch{}
    return {...guessTags(text),source:"keyword"};
  }
}

/* 오류 안내. 색인(인덱스)이 없을 때 관리자에겐 만들기 버튼을 보여 줌 */
function indexLink(e){ const m=String(e?.message||"").match(/https:\/\/console\.firebase\.google\.com\S+/); return m?m[0].replace(/[).,]+$/,""):null; }
function friendly(e){
  const c=e?.code||"";
  if(indexLink(e)) return "데이터를 정리하는 중이에요. 몇 분 뒤 다시 열어 주세요";
  if(/permission-denied/.test(c)) return "권한이 없어요. 다시 로그인해 주세요";
  if(/unavailable|network-request-failed/.test(c) || e?.message==="Failed to fetch") return "인터넷 연결을 확인해 주세요";
  if(/resource-exhausted|quota/.test(c)) return "오늘 사용량이 많아 잠시 쉬고 있어요. 조금 뒤 다시 해 주세요";
  if(/popup-closed|cancelled-popup/.test(c)) return "로그인을 취소했어요";
  if(/unauthorized-domain/.test(c)) return "이 주소는 로그인이 허용되지 않았어요";
  if(/too-many-requests/.test(c)) return "너무 많이 시도했어요. 잠시 뒤 다시 해 주세요";
  return e?.message && e.message.length<70 && /[가-힣]/.test(e.message) ? e.message : "문제가 생겼어요. 잠시 뒤 다시 해 주세요";
}
function indexBtn(e){ const l=indexLink(e); return l && S.me?.isAdmin ? `<a class="btn primary sm" href="${esc(l)}" target="_blank" rel="noopener">색인 만들기</a>` : `<button class="btn sm" data-act="retry">다시 시도</button>`; }
function showError(e){
  console.warn(e);
  const link=indexLink(e);
  if(link && S.me?.isAdmin) return openSheet(`<h3>색인을 만들어야 해요</h3><p>처음 한 번만 필요해요. 버튼을 누르고 Firebase에서 저장을 누른 뒤, 몇 분 기다렸다 새로고침해 주세요.</p><div class="actions"><a class="btn primary block" href="${esc(link)}" target="_blank" rel="noopener">색인 만들기</a><button class="btn block" data-close>닫기</button></div>`);
  toast(friendly(e));
}

/* =========================================================
   레이어 · 바텀시트 — 휴대폰 뒤로 가기로 닫힘
   ========================================================= */
const stack=[];
function pushLayer(onClose){ stack.push(onClose); history.pushState({lf:stack.length},""); }
addEventListener("popstate",()=>{ const f=stack.pop(); f?.(); });
function back(){ if(stack.length) history.back(); }

function openLayer(html, {up=false, cls="", onClose}={}){
  const el=document.createElement("section"); el.className=`layer enter ${up?"up":""}`; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="layer-in ${cls}">${html}</div>`;
  $("#layers").appendChild(el);
  document.body.style.overflow="hidden";
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("enter")));
  pushLayer(()=>{ el._cleanup?.(); onClose?.(); el.classList.add("leave"); setTimeout(()=>{ el.remove(); if(!$("#layers .layer")) document.body.style.overflow=""; },330); });
  return el;
}
function openSheet(html, onReady){
  const scrim=document.createElement("div"); scrim.className="scrim enter";
  const sh=document.createElement("div"); sh.className="sheet enter"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true");
  sh.innerHTML=`<div class="grab"></div>${html}`;
  document.body.append(scrim,sh);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{scrim.classList.remove("enter"); sh.classList.remove("enter");}));
  let closed=false; const close=()=>{ if(!closed) back(); };
  scrim.onclick=close; sh.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  // 아래로 끌어서 닫기 (빠르게 튕기면 짧게 끌어도 닫힘)
  let y0=null,t0=0,dy=0;
  sh.addEventListener("touchstart",e=>{ if(sh.scrollTop>0||e.touches.length>1) return; y0=e.touches[0].clientY; t0=Date.now(); dy=0; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); if(dy>0){ sh.style.transition="none"; sh.style.transform=`translateY(${dy}px)`; } },{passive:true});
  sh.addEventListener("touchend",()=>{ if(y0==null) return; sh.style.transition=""; const v=dy/Math.max(1,Date.now()-t0); sh.style.transform=""; if(dy>110||(dy>24&&v>0.5)) close(); y0=null; });
  pushLayer(()=>{ closed=true; scrim.classList.add("leave"); sh.classList.add("leave"); setTimeout(()=>{scrim.remove(); sh.remove();},330); });
  onReady?.(sh, close);
  return {sh, close};
}
function pickSheet(title, body, options, okLabel, fn){
  let pick=options[0];
  openSheet(`<h3>${esc(title)}</h3>${body?`<p>${esc(body)}</p>`:""}<div class="rows" role="radiogroup">${options.map((r,i)=>`<button class="choice" role="radio" data-r="${esc(r)}" aria-checked="${i===0}">${esc(r)}<span class="radio"></span></button>`).join("")}</div><div class="actions"><button class="btn primary block" id="ok">${esc(okLabel)}</button></div>`,(sh,close)=>{
    sh.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ pick=b.dataset.r; sh.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-checked",x===b)); });
    $("#ok",sh).onclick=async()=>{ $("#ok",sh).disabled=true; try{ await fn(pick,close); }catch(e){ $("#ok",sh).disabled=false; showError(e); } };
  });
}
function confirmSheet(title, body, okLabel, fn, danger=false){
  openSheet(`<h3>${esc(title)}</h3><p>${esc(body)}</p><div class="actions"><button class="btn block ${danger?"danger":"primary"}" id="ok">${esc(okLabel)}</button><button class="btn block" data-close>취소</button></div>`,
    (sh,close)=>{ $("#ok",sh).onclick=async()=>{ $("#ok",sh).disabled=true; try{ await fn(); close(); }catch(e){ $("#ok",sh).disabled=false; showError(e); } }; });
}

function sizeSeg(){ const t=$("#segThumb"); if(!t) return; const w=(t.parentElement.clientWidth-6)/2; t.style.width=w+"px"; t.style.transform=`translateX(${S.type==="lost"?w:0}px)`; }

addEventListener("scroll",()=>{ $("#homeTop")?.classList.toggle("scrolled",scrollY>4); },{passive:true});

function filtered(){
  let list=(S.feed||[]).filter(p=>p.type===S.type);
  const doneCount=list.filter(p=>p.status==="done").length;
  if(!S.showDone) list=list.filter(p=>p.status!=="done");
  if(S.cat!=="전체") list=list.filter(p=>p.cat===S.cat);
  const q=S.q.trim().toLowerCase();
  if(q){ const words=q.split(/\s+/); list=list.filter(p=>{ const hay=[p.title,p.desc,p.place,p.placeDetail,p.cat,p.color,p.tag,...(p.ai?.keywords||[])].join(" ").toLowerCase(); return words.every(w=>hay.includes(w)); }); }
  return {list,doneCount};
}
function paintFeed(){
  const body=$("#feedBody"); if(!body) return;
  document.querySelectorAll("#home .seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.type===S.type));
  sizeSeg();
  document.querySelectorAll("#home .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===S.cat));
  if(!S.feed){ body.innerHTML=`<div class="bar"></div>${skelGrid()}`; return; }
  if(S.feedErr && !S.feed.length){ body.innerHTML=emptyHTML("불러오지 못했어요", esc(friendly(S.feedErr)), indexBtn(S.feedErr)); return; }
  const {list,doneCount}=filtered();
  const narrowed = S.q.trim() || S.cat!=="전체";
  const found=S.type==="found";
  body.innerHTML=`<div class="bar"><h2>${found?"보관 중인 물건":"찾고 있는 물건"}<span class="sub"> ${list.length}</span></h2>
    ${doneCount?`<button class="toggle-done" data-act="done" aria-pressed="${S.showDone}"><span class="box">${IC.check}</span>해결된 것도</button>`:""}</div>
    ${list.length?`<div class="grid">${list.map(p=>itemHTML(p)).join("")}</div>`
      : narrowed ? emptyHTML("맞는 물건이 없어요","다른 단어로 검색하거나 분류를 바꿔 보세요.",`<button class="btn sm" data-act="reset-filter">조건 지우기</button>`)
      : found ? emptyHTML("올라온 물건이 없어요","물건을 주웠다면 사진과 함께 올려 주세요.",`<button class="btn soft sm" data-act="new">주운 물건 올리기</button>`)
      : emptyHTML("찾는 물건이 없어요","잃어버린 물건을 올리면 비슷한 습득물을 찾아 보여 드려요.",`<button class="btn soft sm" data-act="new">분실 신고하기</button>`)}
    ${S.feedFull && !narrowed?`<div class="more"><button class="btn sm" data-act="more">이전 글 더 보기</button></div>`:""}`;
}

async function fillDetail(el,p,soft=false){
  openDetail={id:p.id,el,p,busy:true};

  const pool=(S.feed||[]).filter(x=>x.type!==p.type && x.status!=="done" && !x.hidden);
  let matches=pool.map(o=>({o,s:matchScore(p,o)})).filter(m=>m.s>=0.35).sort((a,b)=>b.s-a.s).slice(0,8);
  if(p.mine && matches.length){ try{ await store.withEmbeddings([p,...matches.map(m=>m.o)]); matches=matches.map(m=>({o:m.o,s:matchScore(p,m.o)})).filter(m=>m.s>=0.3).sort((a,b)=>b.s-a.s); }catch{} }

  $(".detail",el).innerHTML=`
    <div class="nav-bar clear"><button class="icon-btn" data-act="back" aria-label="뒤로">${IC.back}</button><span style="flex:1"></span><button class="icon-btn" data-act="post-menu" data-id="${esc(p.id)}" aria-label="더 보기">${IC.more}</button></div>
    <div class="hero ${p.photo?"":"no-photo"}">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(p.title)} 사진" decoding="async">`:`<div class="cat-ic">${CAT_IC[p.cat]||CAT_IC["기타"]}</div>`}</div>
    <div class="d-head">
      <div class="pills">${p.status==="done"?`<span class="pill done">${found?"주인 찾음":"찾았어요"}</span>`:found?`<span class="pill found">보관 중</span>`:`<span class="pill lost">찾는 중</span>`}${p.hidden?`<span class="pill warn">숨김</span>`:""}<span class="pill num">${esc(p.tag)}</span></div>
      <h2 class="d-title">${esc(p.title)}</h2>
      <div class="d-time">${p.mine?"내가 올린 글 · ":""}${ago(p.createdAt)}</div>
    </div>
    <dl class="facts">
      <div><dt>${found?"주운 곳":"잃은 곳"}</dt><dd>${esc(p.place)}${p.placeDetail?` · ${esc(p.placeDetail)}`:""}</dd></div>
      <div><dt>날짜</dt><dd>${fmtDate(p.when)}</dd></div>
      <div><dt>분류</dt><dd>${esc(p.cat)}${p.color?` · ${esc(p.color)}`:""}</dd></div>
      ${found?`<div><dt>보관</dt><dd>${esc(p.storage||"")}</dd></div>`:""}
    </dl>
    ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}
    ${found&&p.storage==="행정실 분실물함"&&p.status!=="done"&&!p.mine?`<p class="note box" style="margin-top:16px">행정실에서 바로 받을 수 있어요. 내 물건이라는 걸 알 수 있게 특징을 말해 주세요.</p>`:""}
    <div id="revealOut"></div>
    ${matches.length?`<h3 class="section-h">${IC.spark}${found?"이 물건을 찾는 글":"비슷한 습득물"}</h3>
      <div class="hscroll">${matches.map(({o,s})=>itemHTML(o,`<span class="match-score">${Math.round(s*100)}% 비슷해요</span>`)).join("")}</div>`:""}
    <h3 class="section-h">댓글 <span class="count">${comments.length||""}</span></h3>
    <div class="comments">${comments.length?comments.map(c=>`<div class="cmt"><div class="avatar ${c.isOwner?"owner":""}">${IC.user}</div><div><div class="cmt-h"><b>${c.isOwner?"작성자":"익명"}${c.mine?" (나)":""}</b><span>${ago(c.at)}</span></div><p>${esc(c.text)}</p></div></div>`).join(""):`<p class="note">궁금한 점을 남겨 보세요. 댓글은 익명이에요.</p>`}</div>
    <form class="composer" id="cform"><label class="sr" for="ctext">댓글</label><textarea id="ctext" rows="1" maxlength="300" placeholder="댓글 달기"></textarea><button class="send press" type="submit" aria-label="댓글 보내기" disabled>${IC.send}</button></form>
    <p class="note" style="margin-top:8px">학번·연락처 같은 개인정보는 댓글 대신 1:1 대화로 나눠 주세요.</p>
    <div class="bottom-cta"><div class="in">${p.mine

        : `<button class="btn primary press" data-act="resolve" data-id="${esc(p.id)}">${found?"주인에게 돌려줬어요":"물건을 찾았어요"}</button>`)
      : p.status==="done" ? `<button class="btn" disabled>해결된 글이에요</button>`
      : `<button class="btn primary press" data-act="start-chat" data-id="${esc(p.id)}">${IC.chat}${found?"제 물건 같아요":"제가 본 것 같아요"}</button>`}</div></div>`;
  if(soft) el.scrollTop=top;

    catch(err){ send.disabled=false; showError(err); } });
  openDetail.busy=false;
}

function showNew(){
  const draft=ls.get("lf-draft",{});
  const f={type:S.type,title:"",cat:"",color:"",place:"",placeDetail:"",when:today(),storage:STORAGES[0],desc:"",...draft,photo:null,ai:null,aiBusy:false};
  const el=openLayer(`<div class="newpost"></div>`,{up:true,onClose:()=>{ if(f.photo?.url) setTimeout(()=>URL.revokeObjectURL(f.photo.url),400); }});
  const saveDraft=()=>{ const {photo,ai,aiBusy,...rest}=f; ls.set("lf-draft",rest); };
  const g=id=>$("#"+id,el);
  const sync=()=>{ f.title=g("title").value; f.place=g("place").value; f.placeDetail=g("placeDetail").value; f.when=g("when").value; f.desc=g("desc").value; if(g("storage")) f.storage=g("storage").value; saveDraft(); };
  const canPhoto = store.mode==="demo" || !!CONFIG.workerUrl;
  let aiRun=0;
  const runAI=async()=>{
    const my=++aiRun; f.aiBusy=true; draw();
    const r=await store.aiTag(f.photo, (f.title+" "+f.desc).trim());
    if(my!==aiRun || !el.isConnected) return;
    sync(); f.aiBusy=false; f.ai=r;
    if(r.cat && CATS.includes(r.cat) && !f.cat) f.cat=r.cat;
    if(r.color && COLORS.some(c=>c[0]===r.color) && !f.color) f.color=r.color;
    if(!f.title.trim() && r.title) f.title=r.title;
    draw();
  };
  const draw=()=>{
    const found=f.type==="found";
    const active=document.activeElement?.id;
    $(".newpost",el).innerHTML=`
      <div class="nav-bar"><button class="icon-btn" data-act="back" aria-label="닫기">${IC.x}</button><h2>${found?"주운 물건 올리기":"분실 신고"}</h2><span style="width:44px"></span></div>
      <form class="form" id="nform" novalidate>
        <div class="seg" role="tablist" aria-label="종류" style="margin-top:0"><span class="thumb" style="width:calc(50% - 3px);transform:translateX(${found?"0":"100%"})"></span>
          <button type="button" role="tab" data-t="found" aria-selected="${found}">주웠어요</button><button type="button" role="tab" data-t="lost" aria-selected="${!found}">잃어버렸어요</button></div>
        ${canPhoto?`<div class="field"><div class="label">사진 <small>${found?"있으면 주인이 바로 알아봐요":"비슷한 사진도 좋아요"}</small></div>
          <label class="picker">${f.photo?`<img src="${f.photo.url}" alt="고른 사진"><span class="change">${IC.camera}바꾸기</span>`:`<span class="pk">${IC.camera}<span>사진 찍기 또는 고르기</span><small>얼굴이나 이름이 보이면 가려 주세요</small></span>`}<input type="file" id="photo" accept="image/*"></label>
          <div class="ai-line ${f.aiBusy?"busy":""}" ${f.aiBusy||f.ai?"":"hidden"}>${f.aiBusy?IC.loader+"AI가 사진을 보고 있어요":IC.spark+(f.ai?.source==="ai"?"AI가 분류와 색을 골랐어요. 틀리면 고쳐 주세요":"물건 이름으로 분류를 골랐어요")}</div></div>`:""}
        <div class="field"><label class="label" for="title">물건 이름</label><input class="input" id="title" maxlength="40" autocomplete="off" placeholder="${found?"예: 흰색 무선이어폰 케이스":"예: 회색 텀블러"}" value="${esc(f.title)}"></div>

        <div class="field"><div class="label">색 <small>선택</small></div><div class="opts">${COLORS.map(([n,v])=>`<button type="button" class="opt press" data-color="${n}" aria-pressed="${f.color===n}"><i style="background:${v}"></i>${n}</button>`).join("")}</div></div>
        <div class="field"><label class="label" for="place">${found?"주운 곳":"잃어버린 곳"}</label>
          <select class="input" id="place"><option value="">장소 고르기</option>${PLACES.map(p=>`<option ${f.place===p?"selected":""}>${p}</option>`).join("")}</select>

        <div class="field"><label class="label" for="desc">특징 <small>선택</small></label><textarea class="input" id="desc" maxlength="400" placeholder="${found?"주인만 아는 특징(스티커, 이니셜 등)은 빼 두면 진짜 주인인지 확인하기 좋아요":"스티커, 이니셜, 케이스 색처럼 알아볼 수 있는 특징"}">${esc(f.desc)}</textarea></div>

      catch{ toast("이 사진은 열 수 없어요. 다른 사진으로 해 주세요"); } });
    g("submitBtn").onclick=submit;
  };
  let sending=false;
  const submit=async()=>{
    if(sending) return; sync();
    const err=!f.title.trim()?"물건 이름을 적어 주세요":!f.cat?"분류를 골라 주세요":!f.place?"장소를 골라 주세요":"";
    const box=g("ferr"); if(err){ box.textContent=err; box.hidden=false; box.scrollIntoView({block:"center",behavior:"smooth"}); return; }
    const btn=g("submitBtn"); sending=true; btn.disabled=true; btn.textContent=f.photo?"사진 올리는 중…":"올리는 중…";
    try{
      const ai={keywords:(f.ai?.keywords?.length?f.ai.keywords:guessTags(f.title+" "+f.desc).keywords).slice(0,8)};
      const data={type:f.type,title:f.title.trim(),cat:f.cat,color:f.color,place:f.place,placeDetail:f.placeDetail.trim(),when:f.when||today(),desc:f.desc.trim(),ai};
      if(f.type==="found") data.storage=f.storage;
      const id=await store.createPost(data,f.photo);
      ls.del("lf-draft");
      S.type=f.type; S.cat="전체"; S.q=""; S.tab="home";
      back(); toast("올렸어요");
      setTimeout(()=>{ render(); showPost(id); }, 360);
    }catch(er){ sending=false; box.textContent=friendly(er); box.hidden=false; btn.disabled=false; btn.textContent="올리기"; }
  };
  draw();
}

async function showChat(id){
  let c; try{ c=await store.getChat(id); }catch(e){ showError(e); return; }
  if(!c){ toast("대화를 찾을 수 없어요"); return; }
  const markSeen=()=>{ const seen=ls.get("lf-seen-chats",{}); seen[id]=Date.now(); ls.set("lf-seen-chats",seen); };
  markSeen();
  const p=(S.feed||[]).find(x=>x.id===c.postId)||{cat:"기타",title:c.postTitle};
  const canSend=c.role==="starter"||c.role==="owner";
  const el=openLayer(`
    <div class="nav-bar"><button class="icon-btn" data-act="back" aria-label="뒤로">${IC.back}</button><h2>${c.role==="owner"?"연락 온 학생":c.role==="admin"?"대화 기록":"올린 사람"}</h2><span style="width:44px"></span></div>
    <button class="chat-post press" data-act="open" data-id="${esc(c.postId)}">${phHTML(p)}<div style="min-width:0"><div class="row-t" style="font-size:15px">${esc(c.postTitle)}</div><div class="row-s">${p.place?esc(p.place)+" · ":""}글 보기</div></div>${icon(IC.chev,"chev")}</button>
    <div class="bubbles" id="bubbles"></div>
    ${canSend?`<div class="chat-composer"><form class="composer" id="mform"><label class="sr" for="mtext">메시지</label><textarea id="mtext" rows="1" maxlength="500" placeholder="메시지 보내기"></textarea><button class="send press" type="submit" aria-label="보내기" disabled>${IC.send}</button></form></div>`:`<div class="chat-composer"><p class="note box">관리자 열람 중이에요. 메시지를 보낼 수 없어요.</p></div>`}`,{cls:"chat-in",onClose:()=>{ markSeen(); if(S.tab==="chats") setTimeout(render,340); }});
  const sys=`<span class="sys">두 사람과 관리자만 볼 수 있어요.<br>물건은 행정실이나 교실처럼 사람이 있는 곳에서 주고받으세요.</span>`;
  el._cleanup = store.watchMessages(id, msgs=>{
    const box=$("#bubbles",el); if(!box) return;
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 160;
    box.innerHTML = sys + (msgs.length ? msgs.map((m,i)=>{ const me=m.from===c.role || (c.role==="admin"&&m.from==="owner"); const next=msgs[i+1]; const last=!next||next.from!==m.from||(next.at-m.at)>5*60e3;
      const who=c.role==="admin"?(m.from==="owner"?"작성자 · ":"연락한 학생 · "):"";
      return `<div class="bub ${me?"me":""}">${esc(m.text)}</div>${last?`<div class="bub-time ${me?"me":""}">${who}${ago(m.at)}</div>`:""}`; }).join("") : `<span class="sys" style="background:none">첫 인사를 보내 보세요</span>`);
    if(near || !box.dataset.init){ box.dataset.init=1; requestAnimationFrame(()=>el.scrollTo({top:el.scrollHeight})); }
  });
  const ta=$("#mtext",el), send=$("#mform .send",el);
  ta?.addEventListener("input",()=>{ send.disabled=!ta.value.trim(); ta.style.height="40px"; ta.style.height=Math.min(120,ta.scrollHeight)+"px"; });
  ta?.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("#mform",el).requestSubmit(); } });
  $("#mform",el)?.addEventListener("submit",async e=>{ e.preventDefault(); const t=ta.value.trim(); if(!t) return; ta.value=""; ta.style.height="40px"; send.disabled=true;
    try{ await store.sendMessage(id,t); markSeen(); }catch(er){ ta.value=t; send.disabled=false; showError(er); } });
}

/* =========================================================
   설치 (학급 알리미 방식: 카카오톡 등 앱 안 브라우저 탈출 + iOS 안내)
   ========================================================= */
let deferredPrompt=null;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; });
addEventListener("appinstalled",()=>{ toast("설치했어요. 홈 화면에서 열어 보세요",3500); if(S.tab==="me") render(); });
function escapeInApp(){
  const url=location.href.split("#")[0];
  if(isKakao){ location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(url); return; }
  if(isAndroid){ location.href="intent://"+url.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;end"; return; }
  openSheet(`<h3>Safari로 열어 주세요</h3><p>앱 안의 브라우저에서는 로그인과 설치가 막혀 있어요.</p><ol class="howto"><li><span>화면 아래나 위의 ${IC.dots} 메뉴를 눌러요</span></li><li><span>‘Safari로 열기’ 또는 ‘다른 브라우저로 열기’를 눌러요</span></li></ol><div class="actions"><button class="btn block" id="cp">주소 복사하기</button></div>`,(sh)=>{ $("#cp",sh).onclick=()=>copyText(url,"주소를 복사했어요"); });
}
async function install(){
  if(inApp) return escapeInApp();
  if(deferredPrompt){ deferredPrompt.prompt(); const r=await deferredPrompt.userChoice.catch(()=>null); deferredPrompt=null; if(r?.outcome!=="accepted") toast("나중에 내 정보에서 설치할 수 있어요"); return; }
  if(isIOS) return openSheet(`<h3>홈 화면에 추가하기</h3><p>Safari에서 두 번만 누르면 돼요.</p><ol class="howto"><li><span>아래쪽 ${IC.share} 공유 버튼을 눌러요</span></li><li><span>‘홈 화면에 추가’ ${IC.addBox} 를 눌러요</span></li></ol><div class="actions"><button class="btn primary block" data-close>알겠어요</button></div>`);
  openSheet(`<h3>앱으로 설치하기</h3><p>브라우저 오른쪽 위 ${IC.dots} 메뉴에서 ‘홈 화면에 추가’ 또는 ‘앱 설치’를 눌러 주세요.</p><div class="actions"><button class="btn primary block" data-close>알겠어요</button></div>`);
}
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch{ const a=document.createElement("textarea"); a.value=t; a.setAttribute("readonly",""); a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); toast(msg); }catch{ toast(t); } a.remove(); } }

function applyTheme(t){
  const d=document.documentElement;
  if(t==="light"||t==="dark") d.dataset.theme=t; else delete d.dataset.theme;
  t==="system"?ls.del("lf-theme"):(()=>{ try{ localStorage.setItem("lf-theme",t); }catch{} })();
  paintThemeMeta();
}
function paintThemeMeta(){ const bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#ffffff"; $("#themeMeta").content=bg; document.documentElement.style.background=bg; }
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",paintThemeMeta);

/* =========================================================
   이벤트
   ========================================================= */
let busyAct=false;
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(["open","chat","start-chat","resolve","reopen","hide","close-report","reward-ok","reward-no"].includes(a)){ if(busyAct) return; busyAct=true; setTimeout(()=>busyAct=false,500); }
  try{
    if(a==="tab"){ if(S.tab===b.dataset.tab){ scrollTo({top:0,behavior:"smooth"}); return; } S.tab=b.dataset.tab; scrollTo(0,0); render(); }
    else if(a==="type"){ if(S.type!==b.dataset.type){ S.type=b.dataset.type; paintFeed(); } }
    else if(a==="cat"){ S.cat=b.dataset.cat; paintFeed(); }
    else if(a==="clear-q"){ e.preventDefault(); S.q=""; $("#q").value=""; b.hidden=true; paintFeed(); $("#q").focus(); }
    else if(a==="reset-filter"){ S.q=""; S.cat="전체"; const q=$("#q"); if(q) q.value=""; const c=$("[data-act=clear-q]"); if(c) c.hidden=true; paintFeed(); }
    else if(a==="done"){ S.showDone=!S.showDone; paintFeed(); }
    else if(a==="more"){ S.feedN+=40; startFeed(); }
    else if(a==="retry"){ if(S.tab==="home") startFeed(); render(); }
    else if(a==="new"){ showNew(); }
    else if(a==="open"){ await showPost(id); }
    else if(a==="back"){ back(); }
    else if(a==="post-menu"){ postMenu(id); }
    else if(a==="start-chat"){ b.disabled=true; try{ const cid=await store.openChat(id); await showChat(cid); } finally{ b.disabled=false; } }
    else if(a==="chat"){ await showChat(id); }
    else if(a==="resolve"){ await resolveFlow(id); }
    else if(a==="reopen"){ await store.setStatus(id,"open"); toast("다시 열었어요"); }
    else if(a==="hide"){ await store.adminHide(id,true); toast("숨겼어요"); if(S.tab==="admin") render(); }
    else if(a==="close-report"){ await store.adminCloseReport(id); render(); }
    else if(a==="reward-ok"||a==="reward-no"){ await store.adminDecideReward(id,a==="reward-ok"); toast(a==="reward-ok"?"포인트를 지급했어요":"반려했어요"); render(); }
    else if(a==="install"){ install(); }
    else if(a==="theme"){
      const cur=themeNow();
      openSheet(`<h3>화면 모드</h3><div class="rows" role="radiogroup">${[["system","기기 설정 따르기"],["light","밝게"],["dark","어둡게"]].map(([k,l])=>`<button class="choice" role="radio" data-th="${k}" aria-checked="${cur===k}">${l}<span class="radio"></span></button>`).join("")}</div>`,(sh,close)=>{
        sh.querySelectorAll("[data-th]").forEach(x=>x.onclick=()=>{ applyTheme(x.dataset.th); close(); setTimeout(()=>{ if(S.tab==="me") render(); },340); }); }); }
    else if(a==="copy-uid"){ copyText(S.me.uid,"계정 ID를 복사했어요"); }
    else if(a==="logout"){ confirmSheet("로그아웃할까요?","다시 들어올 때 구글 계정으로 로그인하면 돼요.","로그아웃",async()=>{ await store.signOut(); ls.del("lf-feed-cache"); location.reload(); }); }
    else if(a==="reset"){ confirmSheet("체험 데이터를 되돌릴까요?","이 기기에 저장된 체험용 글과 대화가 처음 상태로 돌아가요.","되돌리기",async()=>{ await store.resetDemo(); S.me=await store.me(); S.tab="home"; startFeed(); render(); }); }
    else if(a==="demo-user"){
      openSheet(`<h3>체험 계정</h3><p>계정을 바꿔 가며 대화, 해결, 관리 기능을 확인해 보세요. 체험 내용은 이 기기에만 저장돼요.</p><div class="rows" role="radiogroup">${store.demoUsers().map(u=>`<button class="choice" role="radio" data-u="${u.id}" aria-checked="${u.id===store.uid}">${esc(u.label)}<span class="radio"></span></button>`).join("")}</div>`,(sh,close)=>{
        sh.querySelectorAll("[data-u]").forEach(x=>x.onclick=async()=>{ await store.switchUser(x.dataset.u); S.me=await store.me(); if(S.tab==="admin"&&!S.me.isAdmin) S.tab="home"; close(); startFeed(); toast(`${x.textContent.trim()}(으)로 바꿨어요`); setTimeout(render,340); }); }); }
  }catch(err){ showError(err); }
});

    </div>`;
    $("#sid").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/\D/g,"").slice(0,5); });
    $("#pform").addEventListener("submit",async e=>{ e.preventDefault(); const sid=$("#sid").value.trim(), nm=$("#sname").value.trim(); const er=$("#perr");
      if(!/^\d{5}$/.test(sid)){ er.textContent="학번 5자리를 적어 주세요"; er.hidden=false; return; }
      if(!nm){ er.textContent="이름을 적어 주세요"; er.hidden=false; return; }
      $("#pbtn").disabled=true; try{ await store.saveProfile(sid,nm); boot(); }catch(e){ console.warn(e); $("#pbtn").disabled=false; er.textContent=friendly(e); er.hidden=false; } });
    return;
  }
  app.innerHTML=`<div class="gate">
    <img src="icon-192.png" alt="">
    <h1>잃어버린 물건,<br>사진 한 장으로 찾아요</h1>
    <p>${esc(CONFIG.schoolName)} 학생 누구나 주운 물건을 올리고, 잃어버린 물건을 찾을 수 있어요.</p>
    <div class="spacer"></div>
    ${inApp?`<button class="btn primary block press" data-act="install">${isIOS?"Safari로 열기":"크롬으로 열기"}</button><p class="fine">카카오톡 같은 앱 안에서는 구글 로그인이 막혀 있어요.</p>`
      :`<button class="btn block g-btn press" id="login">${IC.google}구글로 시작하기</button><p class="fine">글과 댓글은 익명으로 올라가요.</p>`}
  </div>`;
  $("#login")?.addEventListener("click",async e=>{ const btn=e.currentTarget; btn.disabled=true; try{ await store.signIn(); boot(); }catch(er){ btn.disabled=false; showError(er); } });
}

/* =========================================================
   시작
   ========================================================= */
let booted=false;
function bootDone(){
  if(booted) return; booted=true;
  const root=document.documentElement, b=$("#boot");
  if(!root.classList.contains("booting")){ b?.remove(); return; }
  setTimeout(()=>{ b.classList.add("off"); setTimeout(()=>{ root.classList.remove("booting"); b.remove(); },240); }, 620);
}
setTimeout(bootDone, 1500);

let visBound=false;
async function boot(){
  paintThemeMeta();
  if(!store){
    if(DEMO) store=new DemoStore();
    else{
      try{ store=new FireStore(); await store.init(); }
      catch(e){ console.warn(e); bootDone(); $("#app").innerHTML=`<div class="gate"><h1>연결하지 못했어요</h1><p>${esc(friendly(e))}</p><div class="spacer"></div><button class="btn primary block" onclick="location.reload()">다시 시도</button></div>`; return; }
      if(store.redirectError) showError(store.redirectError);
    }
  }
  try{ S.me = await store.me(); }
  catch(e){ console.warn(e); bootDone(); $("#app").innerHTML=`<div class="gate"><h1>불러오지 못했어요</h1><p>${esc(friendly(e))}</p><div class="spacer"></div><button class="btn primary block" onclick="location.reload()">다시 시도</button></div>`; return; }
  if(store.mode==="live"){ if(!S.me){ bootDone(); return renderGate(false); } if(S.me.needsProfile){ bootDone(); return renderGate(true); } }
  // 지난번 목록을 먼저 보여 줘서 첫 화면이 빨리 뜸 (곧 실시간 목록으로 바뀜)
  if(store.mode==="live" && !S.feed){ const cached=ls.get("lf-feed-cache"); if(cached?.length) S.feed=cached.map(p=>({...p,mine:store.ownerIds?.has(p.id)||false})); }
  bootDone();
  startFeed();
  render();
  if(!visBound){ visBound=true; document.addEventListener("visibilitychange",()=>{ if(!document.hidden && (S.tab==="chats"||S.tab==="admin") && !stack.length) render(); }); }
}
boot();

/* 서비스워커: 켤 때마다 새 버전 확인, 준비되면 한 번만 자동 새로고침 (학급 알리미 방식) */
if("serviceWorker" in navigator && !DEMO){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading) return; reloading=true; if(!stack.length) location.reload(); });
  addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
      if(reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage({type:"SKIP_WAITING"});
      reg.addEventListener("updatefound",()=>{ const nw=reg.installing; nw?.addEventListener("statechange",()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller) nw.postMessage({type:"SKIP_WAITING"}); }); });
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    }catch{}
  });
}
</script>

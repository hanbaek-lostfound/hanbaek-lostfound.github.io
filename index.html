<style>
/* 레이아웃: 휴대폰 한 손 사용 기준 단일 열 앱, 하단 탭바 고정, 데스크톱에선 가운데 560px */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunken:#e3e8ed;
  --ink:#14202b; --muted:#566473; --line:#d5dce3;
  --tag:#f3c437; --tag-ink:#2a2100;
  --ok:#1f8a5b; --ok-bg:#dff3e9; --warn:#b4541a; --warn-bg:#fbe7da; --danger:#c23a3a;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#172028; --sunken:#1f2a33; --ink:#e7edf2; --muted:#98a6b3; --line:#2a3640;
  --tag:#f3c437; --tag-ink:#2a2100; --ok:#4cc58f; --ok-bg:#163428; --warn:#f0955a; --warn-bg:#3a2417; --danger:#ff7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#172028; --sunken:#1f2a33; --ink:#e7edf2; --muted:#98a6b3; --line:#2a3640;
  --tag:#f3c437; --tag-ink:#2a2100; --ok:#4cc58f; --ok-bg:#163428; --warn:#f0955a; --warn-bg:#3a2417; --danger:#ff7b7b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--ink);font-weight:600}
.demo-bar{font-size:12.5px;background:var(--sunken);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12.5px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toggle{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sec-title{font-family:var(--f-display);font-weight:400;font-size:19px;margin:18px 0 8px}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:88px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.done{opacity:.62}
.thumb{width:88px;height:88px;border-radius:10px;overflow:hidden;background:var(--sunken);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--muted);background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px)}
.card-body{min-width:0;display:grid;gap:3px;align-content:start}
.card-title{font-weight:600;font-size:15.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tag{font-family:var(--f-mono);font-size:11.5px;background:var(--tag);color:var(--tag-ink);padding:2px 8px 2px 16px;position:relative;clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%);letter-spacing:.02em}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--surface)}
.tag.lost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);clip-path:none;border-radius:4px;padding-left:8px}
.tag.lost::before{display:none}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.pill.done{background:var(--sunken);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.count{font-size:12px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:18px;margin-bottom:4px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:flex;height:var(--nav-h)}
.nav button{flex:1;border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav .plus{flex:none;width:64px}
.nav .plus span{width:46px;height:46px;border-radius:14px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font-size:26px;line-height:1}
/* panel */
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.panel-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(40px + env(safe-area-inset-bottom,0px))}
.panel-head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px}
.panel-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.photo{border-radius:var(--r);overflow:hidden;background:var(--sunken);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.d-title{font-size:21px;font-weight:700;line-height:1.35;margin:14px 0 6px;text-wrap:balance}
dl.info{display:grid;grid-template-columns:72px 1fr;gap:6px 12px;margin:12px 0;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.ai-box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);margin-top:14px}
.ai-box h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw span{font-size:12.5px;background:var(--sunken);border-radius:6px;padding:2px 8px}
.match{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.match:first-of-type{border-top:0}
.match .thumb{width:48px;height:48px;border-radius:8px}
.match .ph{font-size:0}
.photo.empty{aspect-ratio:16/7}
.score{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:grid;gap:8px;margin-top:16px}
.actions.two{grid-template-columns:1fr 1fr}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.comments{display:grid;gap:10px;margin-top:8px}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cmt-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.cmt-head b{color:var(--ink)}
.cmt-head b.owner{color:var(--warn)}
.cmt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;gap:8px;margin-top:10px}
.composer textarea,.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;resize:none}
/* form */
.form{display:grid;gap:16px;margin-top:4px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=date],.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.picker{border:1.5px dashed var(--line);border-radius:var(--r);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--surface);overflow:hidden;position:relative;color:var(--muted);font-size:14px;text-align:center;padding:0}
.picker img{width:100%;height:100%;object-fit:cover}
.picker input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 6px;font-size:13px;display:flex;gap:6px;align-items:center}
.sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.hint.ai{display:flex;gap:6px;align-items:flex-start;background:var(--sunken);padding:8px 10px;border-radius:10px}
.err{color:var(--danger);font-size:13px}
/* chat */
.bubbles{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.bub{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--sunken);border-radius:999px;padding:3px 10px}
.chat-composer{position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
/* me page */
.me-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.points{display:flex;align-items:baseline;gap:6px}
.points strong{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.rank{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rank div{display:grid;grid-template-columns:32px 1fr auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.rank div:first-child{border-top:0}
.rank .n{font-family:var(--f-mono);color:var(--muted)}
.rank .you{background:color-mix(in srgb,var(--tag) 22%,transparent)}
.mini{display:grid;gap:8px}
.mini button{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.mini button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.admin-item .btns{display:flex;gap:6px;flex-wrap:wrap}
.reveal{font-family:var(--f-mono);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px}
/* sheet & toast */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,15,20,.45);display:grid;align-items:end;justify-items:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet h3{margin:0;font-size:17px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
html,body{margin:0}
</style>
</head>

};

/* ---------- 공통 상수 ---------- */
const CATS = ["전자기기","의류","학용품","지갑·카드","물병·텀블러","가방","기타"];
const COLORS = [["검정","#1d1f22"],["흰색","#f7f7f7"],["회색","#9aa0a6"],["남색","#23345f"],["파랑","#2f6fe0"],["빨강","#d33b3b"],["초록","#2f9e5b"],["노랑","#f2c94c"],["갈색","#8a5a36"],["분홍","#f29bb8"],["기타","conic-gradient(#d33b3b,#f2c94c,#2f9e5b,#2f6fe0,#d33b3b)"]];

const KEYWORDS = {
  "전자기기":["이어폰","에어팟","버즈","충전기","케이블","보조배터리","폰","휴대폰","핸드폰","계산기","갤럭시","아이폰","워치","헤드폰"],
  "의류":["체육복","후드","패딩","잠바","자켓","재킷","가디건","니트","모자","목도리","장갑","양말","교복","조끼","마이"],

/* ---------- 유틸 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 사진 압축: 긴 변 960px, JPEG 0.72 → 보통 80~180KB */
async function compressImage(file, max=960, q=0.72){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    return { blob, dataUrl: c.toDataURL("image/jpeg", q) };
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- AI: 키워드 추정 + 유사도 매칭 (서버 AI가 있으면 그쪽 결과 우선) ---------- */
function guessTags(text){
  const t = text||""; let cat=null, color=null;
  for(const [c,words] of Object.entries(KEYWORDS)) if(words.some(w=>t.includes(w))){cat=c;break;}
  for(const [c] of COLORS) if(c!=="기타" && t.includes(c)){color=c;break;}
  if(!color){ if(/검은|블랙/.test(t)) color="검정"; else if(/하얀|화이트/.test(t)) color="흰색"; else if(/네이비/.test(t)) color="남색"; }
  const kws = Object.values(KEYWORDS).flat().filter(w=>t.includes(w)).slice(0,5);
  return {cat,color,keywords:kws};
}
function grams(s){ const out=new Set(); (s||"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean).forEach(w=>{ out.add(w); for(let i=0;i<w.length-1;i++) out.add(w.slice(i,i+2)); }); return out; }
function cosine(a,b){ let d=0,x=0,y=0; for(let i=0;i<a.length;i++){d+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i];} return d/(Math.sqrt(x*y)||1); }
function matchScore(a,b){
  if(a.embedding && b.embedding) return Math.max(0,Math.min(1,(cosine(a.embedding,b.embedding)-0.45)/0.4)) * (a.cat===b.cat?1:0.7);
  const A=grams(a.title+" "+(a.desc||"")+" "+(a.ai?.keywords||[]).join(" ")), B=grams(b.title+" "+(b.desc||"")+" "+(b.ai?.keywords||[]).join(" "));
  let inter=0; A.forEach(g=>{if(B.has(g))inter++;});
  let s = inter/Math.max(1,Math.min(A.size,B.size));
  if(a.cat===b.cat) s+=0.25; else s-=0.2;
  if(a.color && a.color===b.color) s+=0.2;
  return Math.max(0,Math.min(1,s));
}

      P({id:"p3",type:"found",owner:"u_b",title:"학생증 (이름 가림)",cat:"지갑·카드",color:"기타",place:"급식실",placeDetail:"출구 쪽 식판 반납대",when:today(),storage:"행정실 분실물함",desc:"본인 확인 후 돌려드려요. 행정실에 맡겼어요.",tag:"F-1902",createdAt:now-26*H,status:"done"}),
      P({id:"p4",type:"lost",owner:"u_a",title:"흰색 에어팟 케이스 잃어버렸어요",cat:"전자기기",color:"흰색",place:"본관 3층",placeDetail:"3반 근처 같아요",when:today(),desc:"고양이 스티커 붙어 있어요. 찾아주시면 감사 포인트 드릴게요!",tag:"L-5530",createdAt:now-1*H}),

  async deletePost(id){ const p=this.db.posts.find(p=>p.id===id); if(p.owner!==this.uid) throw new Error("작성자만 지울 수 있어요"); this.db.posts=this.db.posts.filter(x=>x.id!==id); this.save(); }
  /* 댓글 */
  async listComments(pid){ return (this.db.comments[pid]||[]).filter(c=>!c.hidden).map(({uid,...c})=>({...c,mine:uid===this.uid})); }
  async addComment(pid,text){ const p=this.db.posts.find(p=>p.id===pid); (this.db.comments[pid] ||= []).push({id:rid(),text,isOwner:p.owner===this.uid,uid:this.uid,at:Date.now()}); p.commentCount++; this.save(); }
  /* 1:1 대화 */
  async openChat(pid){
    const p=this.db.posts.find(p=>p.id===pid); if(p.owner===this.uid) throw new Error("내 글에는 대화를 열 수 없어요");
    const id=pid+"__"+this.uid;
    if(!this.db.chats[id]){ this.db.chats[id]={id,postId:pid,starter:this.uid,postTitle:p.title,updatedAt:Date.now(),last:""}; this.db.messages[id]=[]; this.save(); }
    return id;
  }
  chatRole(c){ const p=this.db.posts.find(p=>p.id===c.postId); return c.starter===this.uid?"starter":(p?.owner===this.uid?"owner":(this.db.users[this.uid].isAdmin?"admin":null)); }
  async listChats(){ return Object.values(this.db.chats).filter(c=>{const r=this.chatRole(c); return r==="starter"||r==="owner";}).sort((a,b)=>b.updatedAt-a.updatedAt).map(c=>({id:c.id,postId:c.postId,postTitle:c.postTitle,last:c.last,updatedAt:c.updatedAt,role:this.chatRole(c)})); }
  async getChat(id){ const c=this.db.chats[id]; if(!c) return null; const role=this.chatRole(c); if(!role) throw new Error("볼 수 없는 대화예요"); return {id,postId:c.postId,postTitle:c.postTitle,role}; }
  watchMessages(id,cb){ cb((this.db.messages[id]||[]).slice()); this._w={id,cb}; return ()=>{this._w=null}; }
  async sendMessage(id,text){ const c=this.db.chats[id]; const role=this.chatRole(c); if(role!=="starter"&&role!=="owner") throw new Error("대화 참여자만 보낼 수 있어요");
    this.db.messages[id].push({id:rid(),from:role,text,at:Date.now()}); c.last=text; c.updatedAt=Date.now(); this.save(); if(this._w?.id===id) this._w.cb(this.db.messages[id].slice()); }
  /* 보상 */
  async requestReward(pid, chatId){ const p=this.db.posts.find(p=>p.id===pid); if(p.owner!==this.uid) throw new Error("작성자만 요청할 수 있어요");
    if(this.db.rewards.some(r=>r.postId===pid)) throw new Error("이미 감사 포인트를 요청했어요");
    this.db.rewards.push({id:rid(),postId:pid,chatId,postTitle:p.title,type:p.type,status:"pending",createdAt:Date.now()}); p.status="done"; this.save(); }
  async leaderboard(){ return Object.entries(this.db.users).filter(([,u])=>!u.isAdmin).map(([id,u])=>({nickname:u.nickname,points:u.points,you:id===this.uid})).sort((a,b)=>b.points-a.points).slice(0,10); }
  async myPosts(){ return this.db.posts.filter(p=>p.owner===this.uid).sort((a,b)=>b.createdAt-a.createdAt).map(p=>this.pub(p)); }
  /* 신고 */
  async report(pid,reason){ this.db.reports.push({id:rid(),postId:pid,reason,status:"open",createdAt:Date.now()}); this.save(); }
  /* 관리자 */
  assertAdmin(){ if(!this.db.users[this.uid].isAdmin) throw new Error("관리자만 할 수 있어요"); }
  async adminReveal(pid,why){ this.assertAdmin(); const p=this.db.posts.find(p=>p.id===pid); const u=this.db.users[p.owner];
    this.db.audit.push({postId:pid,why,at:Date.now(),by:this.uid}); this.save(); return {...u.priv}; }
  async adminReports(){ this.assertAdmin(); return this.db.reports.filter(r=>r.status==="open").map(r=>({...r,postTitle:this.db.posts.find(p=>p.id===r.postId)?.title||"(삭제된 글)"})); }
  async adminCloseReport(id){ this.assertAdmin(); this.db.reports.find(r=>r.id===id).status="closed"; this.save(); }
  async adminHide(pid,hidden){ this.assertAdmin(); this.db.posts.find(p=>p.id===pid).hidden=hidden; this.save(); }
  async adminRewards(){ this.assertAdmin(); return this.db.rewards.filter(r=>r.status==="pending"); }
  async adminDecideReward(id,ok){ this.assertAdmin(); const r=this.db.rewards.find(r=>r.id===id); r.status=ok?"approved":"rejected";
    if(ok){ const p=this.db.posts.find(p=>p.id===r.postId); const c=this.db.chats[r.chatId]; const finder = p.type==="lost" ? c?.starter : p.owner; if(finder) this.db.users[finder].points+=CONFIG.rewardPoints; }
    this.save(); }
  async adminAudit(){ this.assertAdmin(); return this.db.audit.slice(-10).reverse(); }
  async aiTag(photo, text){ await new Promise(r=>setTimeout(r,450)); return {...guessTags(text), source:"keyword"}; }
}

/* =========================================================
   데이터 계층 ② 실제 서버 모드 (Firebase + Cloudflare Worker)
   보안의 핵심은 firestore.rules 에 있습니다. 이 코드는 화면용일 뿐이에요.
   ========================================================= */
class FireStore{
  constructor(){ this.mode="live"; }
  async init(){
    const V="10.12.2", B=`https://www.gstatic.com/firebasejs/${V}/`;
    const [app,auth,fs] = await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    this.f=fs; this.a=auth;
    this.app=app.initializeApp(CONFIG.firebase); this.auth=auth.getAuth(this.app); this.db=fs.getFirestore(this.app);
    await new Promise(r=>{ const off=auth.onAuthStateChanged(this.auth,u=>{off();r();}); });
  }
  get uid(){ return this.auth.currentUser?.uid; }
  async signIn(){ const p=new this.a.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await this.a.signInWithPopup(this.auth,p); }
    catch(e){ if(/popup-blocked|operation-not-supported/.test(e.code||"")) await this.a.signInWithRedirect(this.auth,p); else throw e; } }
  async signOut(){ await this.a.signOut(this.auth); }
  d(...p){ return this.f.doc(this.db,...p); } c(...p){ return this.f.collection(this.db,...p); }
  async me(){
    if(!this.uid) return null;
    const {getDoc}=this.f;
    const [pub,priv,adm]=await Promise.all([getDoc(this.d("users",this.uid)),getDoc(this.d("private",this.uid)),getDoc(this.d("admins",this.uid))]);
    if(!priv.exists()) return {uid:this.uid,needsProfile:true};
    return {uid:this.uid,nickname:pub.data()?.nickname||"익명",points:pub.data()?.points||0,isAdmin:adm.exists(),studentId:priv.data().studentId,name:priv.data().name,needsProfile:false};
  }
  async saveProfile(studentId,name){
    const b=this.f.writeBatch(this.db);
    b.set(this.d("private",this.uid),{studentId,name,createdAt:this.f.serverTimestamp()});
    b.set(this.d("users",this.uid),{nickname:randNick(),points:0});
    await b.commit();
  }
  norm(s){ const x=s.data(); return {...x,id:s.id,createdAt:x.createdAt?.toMillis?.()??Date.now()}; }
  async listPosts(){
    const {query,orderBy,limit,getDocs,where}=this.f; const me=this._me||{};
    const q = me.isAdmin ? query(this.c("posts"),orderBy("createdAt","desc"),limit(120)) : query(this.c("posts"),where("hidden","==",false),orderBy("createdAt","desc"),limit(120));
    const snap=await getDocs(q); const mine=new Set((await this.myOwnerDocs()).map(d=>d.id));
    return snap.docs.map(s=>({...this.norm(s),mine:mine.has(s.id)}));
  }
  async myOwnerDocs(){ if(!this.uid) return []; const {query,where,getDocs}=this.f; return (await getDocs(query(this.c("postOwners"),where("ownerUid","==",this.uid)))).docs; }
  async getPost(id){ const s=await this.f.getDoc(this.d("posts",id)); if(!s.exists()) return null; const o=await this.f.getDoc(this.d("postOwners",id)).catch(()=>null); return {...this.norm(s),mine:!!o?.exists?.()}; }
  async uploadPhoto(blob){
    if(!CONFIG.workerUrl) throw new Error("사진 기능은 아직 준비 중이에요");
    const token=await this.auth.currentUser.getIdToken();
    const r=await fetch(CONFIG.workerUrl+"/upload",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"image/jpeg"},body:blob});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||"사진 업로드에 실패했어요");
    return (await r.json()).url;
  }
  async embed(text){
    if(!CONFIG.workerUrl) return null;
    try{ const token=await this.auth.currentUser.getIdToken();
      const r=await fetch(CONFIG.workerUrl+"/ai/embed",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({text})});
      return r.ok?(await r.json()).vector:null; }catch{return null;}
  }
  async createPost(d, photo){
    const id=this.f.doc(this.c("posts")).id;
    const url = photo && CONFIG.workerUrl ? await this.uploadPhoto(photo.blob) : "";
    const vec = await this.embed(`${d.title}. ${d.cat}. ${d.color||""}. ${d.desc||""}`);
    const b=this.f.writeBatch(this.db);
    b.set(this.d("posts",id),{...d,photo:url,status:"open",hidden:false,commentCount:0,tag:tagNo(d.type),createdAt:this.f.serverTimestamp()});
    b.set(this.d("postOwners",id),{ownerUid:this.uid});
    if(vec) b.set(this.d("embeddings",id),{v:vec,type:d.type});
    await b.commit(); return id;
  }
  async withEmbeddings(posts){
    const {getDoc}=this.f;
    await Promise.all(posts.map(async p=>{ if(p.embedding) return; const s=await getDoc(this.d("embeddings",p.id)).catch(()=>null); if(s?.exists()) p.embedding=s.data().v; }));
    return posts;
  }
  async setStatus(id,status){ await this.f.updateDoc(this.d("posts",id),{status}); }
  async deletePost(id){ const b=this.f.writeBatch(this.db); b.delete(this.d("posts",id)); b.delete(this.d("postOwners",id)); b.delete(this.d("embeddings",id)); await b.commit(); }
  async listComments(pid){ const {query,orderBy,getDocs}=this.f; const s=await getDocs(query(this.c("posts",pid,"comments"),orderBy("at","asc"))); return s.docs.map(x=>({...x.data(),id:x.id,at:x.data().at?.toMillis?.()??Date.now()})).filter(c=>!c.hidden); }
  async addComment(pid,text){
    const isOwner = (await this.f.getDoc(this.d("postOwners",pid)).catch(()=>null))?.exists?.()||false;
    const cid=this.f.doc(this.c("posts",pid,"comments")).id; const b=this.f.writeBatch(this.db);
    b.set(this.d("posts",pid,"comments",cid),{text,isOwner,hidden:false,at:this.f.serverTimestamp()});
    b.set(this.d("commentAuthors",pid+"_"+cid),{uid:this.uid,postId:pid});
    b.update(this.d("posts",pid),{commentCount:this.f.increment(1)});
    await b.commit();
  }
  /* 대화 경로: posts/{글}/chats/{연락한 학생 uid}/messages — 규칙에서 경로만으로 권한을 판단할 수 있어요 */
  split(id){ const i=id.indexOf("__"); return [id.slice(0,i), id.slice(i+2)]; }
  async openChat(pid){
    const ref=this.d("posts",pid,"chats",this.uid); const s=await this.f.getDoc(ref).catch(()=>null);
    if(!s?.exists()){ const p=await this.getPost(pid); if(p.mine) throw new Error("내 글에는 대화를 열 수 없어요");
      await this.f.setDoc(ref,{postId:pid,starterUid:this.uid,postTitle:p.title,last:"",updatedAt:this.f.serverTimestamp()}); }
    return pid+"__"+this.uid;
  }
  async listChats(){
    const {query,where,getDocs,collectionGroup}=this.f;
    const started=(await getDocs(query(collectionGroup(this.db,"chats"),where("starterUid","==",this.uid)))).docs.map(d=>({...d.data(),id:d.data().postId+"__"+d.id,role:"starter"}));
    const owned=[];
    for(const o of await this.myOwnerDocs()){ const s=await getDocs(this.c("posts",o.id,"chats")); owned.push(...s.docs.map(d=>({...d.data(),id:o.id+"__"+d.id,role:"owner"}))); }
    return [...started,...owned].map(c=>({...c,updatedAt:c.updatedAt?.toMillis?.()??0})).sort((a,b)=>b.updatedAt-a.updatedAt);
  }
  async getChat(id){ const [pid,sid]=this.split(id); const s=await this.f.getDoc(this.d("posts",pid,"chats",sid)); if(!s.exists()) return null; const c=s.data();
    const role = sid===this.uid?"starter":((await this.f.getDoc(this.d("postOwners",pid)).catch(()=>null))?.exists?.()?"owner":"admin");
    return {id,postId:pid,postTitle:c.postTitle,role}; }
  watchMessages(id,cb){ const [pid,sid]=this.split(id); const {query,orderBy,onSnapshot}=this.f;
    return onSnapshot(query(this.c("posts",pid,"chats",sid,"messages"),orderBy("at","asc")),s=>cb(s.docs.map(d=>({...d.data(),id:d.id,at:d.data().at?.toMillis?.()??Date.now()}))),()=>toast("대화를 불러오지 못했어요")); }
  async sendMessage(id,text){ const c=await this.getChat(id); const [pid,sid]=this.split(id); const b=this.f.writeBatch(this.db);
    b.set(this.f.doc(this.c("posts",pid,"chats",sid,"messages")),{from:c.role,text,at:this.f.serverTimestamp()});
    b.update(this.d("posts",pid,"chats",sid),{last:text.slice(0,80),updatedAt:this.f.serverTimestamp()}); await b.commit(); }
  async requestReward(pid,chatId){ await this.f.setDoc(this.d("rewards",pid),{postId:pid,chatId,status:"pending",createdAt:this.f.serverTimestamp()}); await this.setStatus(pid,"done"); }
  async leaderboard(){ const {query,orderBy,limit,getDocs}=this.f; const s=await getDocs(query(this.c("users"),orderBy("points","desc"),limit(10))); return s.docs.map(d=>({...d.data(),you:d.id===this.uid})); }
  async myPosts(){ const ids=(await this.myOwnerDocs()).map(d=>d.id); const out=[]; for(const id of ids){ const p=await this.getPost(id); if(p) out.push(p);} return out.sort((a,b)=>b.createdAt-a.createdAt); }
  async report(pid,reason){ await this.f.addDoc(this.c("reports"),{postId:pid,reason,status:"open",reporterUid:this.uid,createdAt:this.f.serverTimestamp()}); }
  async adminReveal(pid,why){
    const o=await this.f.getDoc(this.d("postOwners",pid)); const uid=o.data().ownerUid;
    await this.f.addDoc(this.c("auditLogs"),{postId:pid,why,by:this.uid,at:this.f.serverTimestamp()});
    const p=await this.f.getDoc(this.d("private",uid)); return p.data();
  }
  async adminReports(){ const {query,where,getDocs}=this.f; const s=await getDocs(query(this.c("reports"),where("status","==","open")));
    return Promise.all(s.docs.map(async d=>({...d.data(),id:d.id,postTitle:(await this.getPost(d.data().postId))?.title||"(삭제된 글)"}))); }
  async adminCloseReport(id){ await this.f.updateDoc(this.d("reports",id),{status:"closed"}); }
  async adminHide(pid,hidden){ await this.f.updateDoc(this.d("posts",pid),{hidden}); }
  async adminRewards(){ const {query,where,getDocs}=this.f; const s=await getDocs(query(this.c("rewards"),where("status","==","pending")));
    return Promise.all(s.docs.map(async d=>({...d.data(),id:d.id,postTitle:(await this.getPost(d.data().postId))?.title||"(삭제된 글)"}))); }
  async adminDecideReward(id,ok){
    const r=(await this.f.getDoc(this.d("rewards",id))).data(); const b=this.f.writeBatch(this.db);
    b.update(this.d("rewards",id),{status:ok?"approved":"rejected"});
    if(ok){ const post=(await this.f.getDoc(this.d("posts",r.postId))).data();
      const finder = post.type==="lost" ? this.split(r.chatId)[1] : (await this.f.getDoc(this.d("postOwners",r.postId))).data()?.ownerUid;
      if(finder) b.update(this.d("users",finder),{points:this.f.increment(CONFIG.rewardPoints)}); }
    await b.commit();
  }
  async adminAudit(){ const {query,orderBy,limit,getDocs}=this.f; const s=await getDocs(query(this.c("auditLogs"),orderBy("at","desc"),limit(10))); return s.docs.map(d=>({...d.data(),at:d.data().at?.toMillis?.()??0})); }
  async aiTag(photo,text){
    if(!CONFIG.workerUrl) return {...guessTags(text),source:"keyword"};
    try{ const token=await this.auth.currentUser.getIdToken(); const fd=new FormData(); if(photo) fd.append("image",photo.blob,"p.jpg"); fd.append("text",text||"");
      const r=await fetch(CONFIG.workerUrl+"/ai/tag",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});
      if(r.ok){ const j=await r.json(); return {...guessTags(text),...j,source:"ai"}; } }catch{}
    return {...guessTags(text),source:"keyword"};
  }
}

function thumbHTML(p){ return p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : `<div class="ph">${esc(p.cat||"기타")}</div>`; }
function statusPill(p){ if(p.hidden) return `<span class="pill warn">숨김</span>`; if(p.status==="done") return `<span class="pill done">${p.type==="found"?"주인 찾음":"찾았어요"}</span>`; return p.type==="found"?`<span class="pill">보관 중</span>`:`<span class="pill warn">찾는 중</span>`; }
function cardHTML(p){
  return `<button class="card ${p.status==="done"?"done":""}" data-act="open" data-id="${esc(p.id)}">
    <div class="thumb">${thumbHTML(p)}</div>

function renderNav(){

function headerHTML(){

async function render(){
  $("#nav").hidden=false; renderNav();
  const app=$("#app");
  if(S.tab==="found"||S.tab==="lost") return renderFeed(app);
  if(S.tab==="me") return renderMe(app);
  if(S.tab==="admin") return renderAdmin(app);
}

async function renderFeed(app){
  S.posts = await store.listPosts();
  const type=S.tab;
  let list=S.posts.filter(p=>p.type===type);
  const doneCount=list.filter(p=>p.status==="done").length;
  if(!S.showDone) list=list.filter(p=>p.status!=="done");
  if(S.cat!=="전체") list=list.filter(p=>p.cat===S.cat);
  if(S.q.trim()){ const q=S.q.trim(); list=list.filter(p=>(p.title+p.desc+p.place+(p.placeDetail||"")+p.cat+(p.color||"")+p.tag).includes(q)); }
  app.innerHTML = headerHTML()+`
    <div class="search"><label class="sr" for="q">검색</label><input id="q" type="search" placeholder="${type==="found"?"이어폰, 체육복, 급식실…":"잃어버린 물건 검색"}" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="분류" style="margin-top:10px">${["전체",...CATS].map(c=>`<button class="chip" data-act="cat" data-cat="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join("")}</div>
    <div class="row-between" style="margin-top:12px"><h2 class="sec-title" style="margin:0">${type==="found"?"주인을 찾고 있어요":"찾아주세요"}</h2>
      ${doneCount?`<label class="toggle"><input type="checkbox" id="showDone" ${S.showDone?"checked":""}> 해결된 것도 보기 (${doneCount})</label>`:""}</div>
    <div class="list" style="margin-top:10px">${list.length?list.map(cardHTML).join(""):`<div class="empty"><b>${S.q||S.cat!=="전체"?"조건에 맞는 글이 없어요":(type==="found"?"아직 등록된 습득물이 없어요":"아직 분실 신고가 없어요")}</b>${type==="found"?"물건을 주웠다면 아래 + 버튼으로 사진과 장소를 올려 주세요.":"잃어버린 물건을 + 버튼으로 등록하면 비슷한 습득물을 찾아 알려드려요."}</div>`}</div>`;
  const q=$("#q"); q.addEventListener("input",e=>{ S.q=e.target.value; clearTimeout(S._qt); S._qt=setTimeout(()=>{ const pos=q.selectionStart; renderFeed(app).then(()=>{const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos);}); },220); });
  $("#showDone")?.addEventListener("change",e=>{S.showDone=e.target.checked; renderFeed(app);});
}

function closePanel(){ S.unsub?.(); S.unsub=null; $("#layer").innerHTML=""; document.body.style.overflow=""; S.view=null; render(); }

async function showPost(id){

  S.view={kind:"post",id};
  const comments = await store.listComments(id);
  let others = (S.posts.length?S.posts:await store.listPosts()).filter(x=>x.type!==p.type && x.status!=="done" && !x.hidden);
  if(store.withEmbeddings){ await store.withEmbeddings([p,...others]); }
  const matches = others.map(o=>({o,s:matchScore(p,o)})).filter(m=>m.s>=0.45).sort((a,b)=>b.s-a.s).slice(0,3);
  const isAdmin=S.me?.isAdmin;
  openPanel(`${head(p.type==="found"?"습득물":"분실물")}

          : `<button class="btn accent" data-act="resolve" data-id="${esc(p.id)}">${p.type==="found"?"주인에게 돌려줬어요":"물건을 찾았어요"}</button>`)
        : `<button class="btn primary" data-act="start-chat" data-id="${esc(p.id)}">${p.type==="found"?"제 물건 같아요":"제가 본 것 같아요"}</button><button class="btn" data-act="focus-comment">댓글 쓰기</button>`}

    <h3 class="sec-title">댓글 ${comments.length||""}</h3>
    <p class="hint" style="margin-top:-6px">댓글은 익명이에요. 학번·전화번호 같은 개인정보는 1:1 대화에서만 나눠 주세요.</p>
    <div class="comments">${comments.map(c=>`<div class="cmt"><div class="cmt-head"><b class="${c.isOwner?"owner":""}">${c.isOwner?"작성자":"익명"}${c.mine?" (나)":""}</b><span>${ago(c.at)}</span></div><p>${esc(c.text)}</p></div>`).join("")||`<div class="hint">첫 댓글을 남겨 보세요.</div>`}</div>
    <form class="composer" id="cform"><label class="sr" for="ctext">댓글</label><textarea id="ctext" rows="1" maxlength="300" placeholder="혹시 스티커 붙어 있나요?"></textarea><button class="btn primary small" type="submit">등록</button></form>`);
  $("#cform").addEventListener("submit",async e=>{ e.preventDefault(); const t=$("#ctext").value.trim(); if(!t) return; if(/\d{2,3}-?\d{3,4}-?\d{4}/.test(t)){ toast("전화번호는 댓글 대신 1:1 대화로 보내 주세요"); return; }
    try{ await store.addComment(id,t); showPost(id);}catch(err){toast(err.message);} });
}

/* ---------- 패널: 새 글 ---------- */
function showNew(type="found"){
  S.view={kind:"new"};
  const f={type,title:"",cat:"",color:"",place:"",placeDetail:"",when:today(),storage:STORAGES[0],desc:"",photo:null,ai:null};
  const draw=()=>{
    openPanel(`${head("새로 등록하기")}
    <form class="form" id="nform" novalidate>
      <div class="seg" role="group" aria-label="종류"><button type="button" data-t="found" aria-pressed="${f.type==="found"}">물건을 주웠어요</button><button type="button" data-t="lost" aria-pressed="${f.type==="lost"}">물건을 잃어버렸어요</button></div>
      ${store.mode==="live"&&!CONFIG.workerUrl?`<div class="hint ai">사진 올리기는 곧 열려요. 지금은 글로만 등록할 수 있어요.</div>`:`<div class="field"><span class="lbl">사진 ${f.type==="found"?"(권장)":"(있으면)"}</span>
        <label class="picker" for="photo">${f.photo?`<img src="${f.photo.dataUrl}" alt="고른 사진">`:`<span>눌러서 사진 고르기<br><span class="hint">얼굴이나 이름이 보이면 가려 주세요</span></span>`}<input type="file" id="photo" accept="image/*"></label></div>`}
      <div class="field"><label for="title">물건 이름</label><input type="text" id="title" maxlength="40" placeholder="${f.type==="found"?"흰색 무선이어폰 케이스":"회색 텀블러"}" value="${esc(f.title)}"></div>
      <button type="button" class="btn small" id="aiBtn" style="justify-self:start">${ICON.spark} AI로 분류·색상 채우기</button>
      ${f.ai?`<div class="hint ai">${ICON.spark}<span>${f.ai.source==="ai"?"AI가 사진과 설명을 보고":"이름과 설명의 단어로"} 채웠어요${f.ai.keywords?.length?": "+f.ai.keywords.map(esc).join(", "):""}. 틀리면 직접 고쳐 주세요.</span></div>`:""}
      <div class="field"><span class="lbl">분류</span><div class="swatches">${CATS.map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${f.cat===c}">${c}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">색상</span><div class="swatches">${COLORS.map(([n,v])=>`<button type="button" class="sw" data-color="${n}" aria-pressed="${f.color===n}"><i style="background:${v}"></i>${n}</button>`).join("")}</div></div>
      <div class="field"><label for="place">${f.type==="found"?"주운 곳":"잃어버린 곳(추정)"}</label><select id="place"><option value="">고르기</option>${PLACES.map(p=>`<option ${f.place===p?"selected":""}>${p}</option>`).join("")}</select>
        <input type="text" id="placeDetail" maxlength="40" placeholder="자세한 위치 (예: 1-3반 앞 사물함 위)" value="${esc(f.placeDetail)}"></div>
      <div class="field"><label for="when">날짜</label><input type="date" id="when" value="${f.when}" max="${today()}"></div>
      ${f.type==="found"?`<div class="field"><label for="storage">지금 어디에 맡겼나요?</label><select id="storage">${STORAGES.map(s=>`<option ${f.storage===s?"selected":""}>${s}</option>`).join("")}</select><span class="hint">행정실에 맡기면 주인이 바로 찾아갈 수 있어서 가장 좋아요.</span></div>`:""}
      <div class="field"><label for="desc">특징</label><textarea id="desc" maxlength="400" placeholder="${f.type==="found"?"스티커, 흠집, 이니셜처럼 주인만 아는 특징은 일부러 빼 두면 진짜 주인인지 확인하기 좋아요.":"스티커, 이니셜, 케이스 색 같은 특징을 적어 주세요."}">${esc(f.desc)}</textarea></div>
      <div class="err" id="ferr" hidden></div>
      <button class="btn primary" type="submit" id="submitBtn">등록하기</button>
    </form>`);
    const sync=()=>{ f.title=$("#title").value; f.place=$("#place").value; f.placeDetail=$("#placeDetail").value; f.when=$("#when").value; f.desc=$("#desc").value; if($("#storage")) f.storage=$("#storage").value; };
    $("#nform").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.t){ sync(); f.type=b.dataset.t; draw(); }
      else if(b.dataset.cat){ sync(); f.cat=b.dataset.cat; draw(); }
      else if(b.dataset.color){ sync(); f.color=b.dataset.color; draw(); }
      else if(b.id==="aiBtn"){ sync(); b.disabled=true; b.textContent="분석하는 중…";
        store.aiTag(f.photo, f.title+" "+f.desc).then(r=>{ f.ai=r; if(r.cat&&CATS.includes(r.cat)) f.cat=r.cat; if(r.color&&COLORS.some(c=>c[0]===r.color)) f.color=r.color; if(!f.title&&r.title) f.title=r.title; draw(); if(!r.cat&&!r.color) toast("단서가 부족해요. 물건 이름을 먼저 적어 주세요"); }); }
    });
    $("#photo")?.addEventListener("change",async e=>{ const file=e.target.files?.[0]; if(!file) return; if(!file.type.startsWith("image/")){toast("사진 파일만 올릴 수 있어요");return;} sync();
      try{ f.photo=await compressImage(file); draw(); }catch{ toast("사진을 열 수 없어요. 다른 사진으로 해 주세요"); } });
    $("#nform").addEventListener("submit",async e=>{ e.preventDefault(); sync();
      const err = !f.title.trim()?"물건 이름을 적어 주세요":!f.cat?"분류를 골라 주세요":!f.place?"장소를 골라 주세요":"";
      const box=$("#ferr"); if(err){ box.textContent=err; box.hidden=false; return; }
      const btn=$("#submitBtn"); btn.disabled=true; btn.textContent="올리는 중…";
      try{
        const ai=f.ai?{keywords:f.ai.keywords||[]}:{keywords:guessTags(f.title+" "+f.desc).keywords};
        const data={type:f.type,title:f.title.trim(),cat:f.cat,color:f.color,place:f.place,placeDetail:f.placeDetail.trim(),when:f.when,desc:f.desc.trim(),ai};
        if(f.type==="found") data.storage=f.storage;
        const id=await store.createPost(data,f.photo);
        S.tab=f.type; S.cat="전체"; S.q=""; toast("등록했어요"); S.posts=[]; await render(); showPost(id);
      }catch(er){ box.textContent=er.message||"등록하지 못했어요. 잠시 뒤 다시 해 주세요"; box.hidden=false; btn.disabled=false; btn.textContent="등록하기"; }
    });
  };
  draw();
}

/* ---------- 패널: 1:1 대화 ---------- */
async function showChat(id){
  let c; try{ c=await store.getChat(id);}catch(e){ toast(e.message); return; }
  if(!c){ toast("대화를 찾을 수 없어요"); return; }
  S.view={kind:"chat",id};
  const myRole=c.role, canSend = myRole==="starter"||myRole==="owner";
  openPanel(`${head(c.postTitle)}
    <button class="link" data-act="open" data-id="${esc(c.postId)}">글 보기</button>
    <div class="bubbles" id="bubbles"><span class="sys">이 대화는 두 사람과 관리자만 볼 수 있어요</span></div>
    ${canSend?`<form class="chat-composer composer" id="mform"><label class="sr" for="mtext">메시지</label><input id="mtext" maxlength="500" placeholder="${myRole==="starter"?"점심시간에 행정실 앞에서 받을 수 있을까요?":"메시지 보내기"}" autocomplete="off"><button class="btn primary small" type="submit">보내기</button></form>`:`<p class="hint">관리자 열람 모드예요. 메시지를 보낼 수 없어요.</p>`}`);
  S.unsub = store.watchMessages(id, msgs=>{
    const box=$("#bubbles"); if(!box) return;
    box.innerHTML=`<span class="sys">이 대화는 두 사람과 관리자만 볼 수 있어요</span>`+(msgs.length?msgs.map(m=>{ const me=m.from===myRole; const who=m.from==="owner"?"작성자":"상대방";
      return `<div class="bub ${me?"me":""}">${esc(m.text)}<small>${me?"나":who} · ${ago(m.at)}</small></div>`; }).join(""):`<span class="sys">처음 인사를 보내 보세요. 직접 만나서 건네는 게 가장 안전해요.</span>`);
    window.scrollTo(0,document.body.scrollHeight); $(".panel")?.scrollTo(0,1e6);
  });
  $("#mform")?.addEventListener("submit",async e=>{ e.preventDefault(); const i=$("#mtext"); const t=i.value.trim(); if(!t) return; i.value=""; try{ await store.sendMessage(id,t);}catch(er){toast(er.message);} });
}

/* ---------- 하단 시트 ---------- */
function sheet(html, onReady){
  const L=document.createElement("div"); L.className="scrim"; L.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  L.addEventListener("click",e=>{ if(e.target===L) L.remove(); }); document.body.appendChild(L); onReady?.(L, ()=>L.remove());
}

async function resolveFlow(pid){
  const p=await store.getPost(pid); const chats=(await store.listChats()).filter(c=>c.postId===pid);
  sheet(`<h3>${p.type==="found"?"누구에게 돌려줬나요?":"누가 찾아줬나요?"}</h3>
    <p>${chats.length?`고른 학생에게 감사 포인트 ${CONFIG.rewardPoints}점을 요청해요. 관리자가 대화를 확인한 뒤 지급돼요.`:"이 글로 시작된 1:1 대화가 없어서 감사 포인트 없이 해결로만 표시돼요."}</p>
    ${chats.map((c,i)=>`<label class="btn" style="text-align:left;display:flex;gap:10px"><input type="radio" name="who" value="${esc(c.id)}" ${i===0?"checked":""}> 대화 상대 ${i+1}<span class="hint" style="margin-left:auto;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.last||"")}</span></label>`).join("")}
    ${chats.length?`<label class="btn ghost" style="text-align:left;display:flex;gap:10px"><input type="radio" name="who" value=""> 대화 없이 해결됐어요</label>`:""}
    <button class="btn accent" id="ok">해결로 표시하기</button><button class="btn ghost" id="cancel">취소</button>`,
  (L,close)=>{ $("#cancel",L).onclick=close; $("#ok",L).onclick=async()=>{ const who=L.querySelector('input[name=who]:checked')?.value;
    try{ if(who) await store.requestReward(pid,who); else await store.setStatus(pid,"done"); close(); toast(who?"해결! 감사 포인트를 요청했어요":"해결로 표시했어요"); showPost(pid);}catch(e){toast(e.message);} }; });
}

function confirmSheet(title,body,okLabel,fn,danger){
  sheet(`<h3>${esc(title)}</h3><p>${esc(body)}</p><button class="btn ${danger?"danger":"primary"}" id="ok">${esc(okLabel)}</button><button class="btn ghost" id="cancel">취소</button>`,
    (L,close)=>{ $("#cancel",L).onclick=close; $("#ok",L).onclick=async()=>{ try{ await fn(); close(); }catch(e){ toast(e.message);} }; });
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.tagName==="SELECT") return;
  const a=b.dataset.act, id=b.dataset.id;
  try{
    if(a==="tab"){ S.tab=b.dataset.tab; S.cat="전체"; S.q=""; window.scrollTo(0,0); render(); }
    else if(a==="cat"){ S.cat=b.dataset.cat; render(); }
    else if(a==="new"){ showNew(S.tab==="lost"?"lost":"found"); }
    else if(a==="open"){ showPost(id); }
    else if(a==="close"){ closePanel(); }
    else if(a==="focus-comment"){ $("#ctext")?.focus(); $("#ctext")?.scrollIntoView({block:"center",behavior:"smooth"}); }
    else if(a==="start-chat"){ const cid=await store.openChat(id); showChat(cid); }
    else if(a==="chat"){ showChat(id); }
    else if(a==="resolve"){ resolveFlow(id); }
    else if(a==="reopen"){ await store.setStatus(id,"open"); toast("다시 열었어요"); showPost(id); }
    else if(a==="delete"){ confirmSheet("글을 지울까요?","지운 글과 댓글은 되돌릴 수 없어요.","삭제",async()=>{ await store.deletePost(id); toast("삭제했어요"); closePanel(); },true); }
    else if(a==="report"){
      sheet(`<h3>신고 사유</h3>${["장난·거짓 글","욕설·비하","개인정보 노출","기타"].map((r,i)=>`<label class="btn ghost" style="text-align:left;display:flex;gap:10px"><input type="radio" name="r" value="${r}" ${i===0?"checked":""}> ${r}</label>`).join("")}<button class="btn danger" id="ok">신고하기</button><button class="btn ghost" id="cancel">취소</button>`,
        (L,close)=>{ $("#cancel",L).onclick=close; $("#ok",L).onclick=async()=>{ await store.report(id,L.querySelector("input[name=r]:checked").value); close(); toast("신고했어요. 관리자가 확인해요"); }; }); }
    else if(a==="reveal"){
      sheet(`<h3>작성자 확인</h3><p>열람한 사람, 시간, 사유가 기록에 남아요.</p><div class="field"><label for="why">사유</label><select id="why"><option>장난·허위 글 확인</option><option>물건 전달 중재</option><option>분실물 관련 분쟁</option><option>기타 안전 문제</option></select></div><button class="btn primary" id="ok">확인하기</button><button class="btn ghost" id="cancel">취소</button>`,
        (L,close)=>{ $("#cancel",L).onclick=close; $("#ok",L).onclick=async()=>{ try{ const r=await store.adminReveal(id,$("#why",L).value); close(); $("#revealOut").innerHTML=`<div class="reveal">작성자: ${esc(r.studentId)} ${esc(r.name)}</div>`; }catch(e){toast(e.message);} }; }); }
    else if(a==="hide"||a==="unhide"){ await store.adminHide(id,a==="hide"); toast(a==="hide"?"숨겼어요":"다시 보이게 했어요"); if(S.view?.kind==="post") showPost(id); else render(); }
    else if(a==="close-report"){ await store.adminCloseReport(id); render(); }
    else if(a==="reward-ok"||a==="reward-no"){ await store.adminDecideReward(id,a==="reward-ok"); toast(a==="reward-ok"?"포인트를 지급했어요":"반려했어요"); render(); }
    else if(a==="reset"){ confirmSheet("체험 데이터를 되돌릴까요?","이 기기에 저장된 체험용 글과 대화가 처음 상태로 돌아가요.","되돌리기",async()=>{ await store.resetDemo(); S.me=await store.me(); S.tab="found"; render(); }); }
    else if(a==="logout"){ await store.signOut(); location.reload(); }
  }catch(err){ toast(err.message||"문제가 생겼어요"); }
});
document.addEventListener("change",async e=>{ if(e.target.id==="demoUser"){ await store.switchUser(e.target.value); S.me=await store.me(); if(S.tab==="admin"&&!S.me.isAdmin) S.tab="found"; toast(`${e.target.selectedOptions[0].text}(으)로 바꿨어요`); render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const s=$(".scrim"); if(s) s.remove(); else if($("#layer").innerHTML) closePanel(); } });

/* ---------- 로그인 화면 (실제 서버 모드) ---------- */
function renderGate(needsProfile){
  $("#nav").innerHTML=""; $("#nav").hidden=true;
  $("#app").innerHTML=`<div class="top"><div class="brand"><h1>분실물 알리미<small>${esc(CONFIG.schoolName)} 전교생이 함께 찾아요</small></h1></div></div>
  <div class="me-card" style="margin-top:20px">
    ${needsProfile?`<b>처음 한 번만 학번을 등록해요</b><p class="hint" style="margin:0">학번과 이름은 관리자만 볼 수 있어요. 다른 학생에게는 랜덤 별명으로만 보여요. 장난 글을 막기 위한 장치예요.</p>
      <form id="pform" class="form"><div class="field"><label for="sid">학번 (5자리)</label><input type="text" id="sid" inputmode="numeric" maxlength="5" pattern="\\d{5}" placeholder="10312"></div>
      <div class="field"><label for="sname">이름</label><input type="text" id="sname" maxlength="10"></div><div class="err" id="perr" hidden></div><button class="btn primary">시작하기</button></form>`
    :`<b>학교 분실물, 사진 한 장으로 찾아요</b><p class="hint" style="margin:0">구글 계정으로 로그인하면 글과 댓글을 익명으로 올릴 수 있어요.</p><button class="btn primary" id="login">구글로 로그인</button>`}
  </div>`;
  $("#login")?.addEventListener("click",async()=>{ try{ await store.signIn(); boot(); }catch(e){ console.warn(e); toast(/unauthorized-domain/.test(e.code||"")?"이 주소가 Firebase 승인된 도메인에 없어요":"로그인하지 못했어요"); } });
  $("#pform")?.addEventListener("submit",async e=>{ e.preventDefault(); const sid=$("#sid").value.trim(), nm=$("#sname").value.trim(); const er=$("#perr");
    if(!/^\d{5}$/.test(sid)||!nm){ er.textContent="학번 5자리와 이름을 적어 주세요"; er.hidden=false; return; }
    try{ await store.saveProfile(sid,nm); boot(); }catch(e){ console.warn(e); er.textContent="저장하지 못했어요 · 오류: "+(e.code||e.message||"알 수 없음"); er.hidden=false; } });
}

async function boot(){
  if(!store){
    if(CONFIG.firebase){ try{ store=new FireStore(); await store.init(); }catch(e){ console.warn("서버 연결 실패, 체험 모드로 실행",e); store=new DemoStore(); } }
    else store=new DemoStore();
  }
  try{ S.me = await store.me(); }
  catch(e){ console.warn(e); $("#app").innerHTML=`<div class="empty" style="margin-top:24px"><b>서버에 연결하지 못했어요</b>오류: ${esc(e.code||e.message||"알 수 없음")}<br>잠시 뒤 새로고침해 주세요.</div>`; return; }
  if(store.mode==="live"){ store._me=S.me; if(!S.me) return renderGate(false); if(S.me.needsProfile) return renderGate(true); }
  render();
}
boot();
